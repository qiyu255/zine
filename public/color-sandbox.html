<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>调色板</title>
  <style>
    :root {
      --bg: #1c1c1f;
      --surface: #242428;
      --surface-2: #2c2c31;
      --border: #34343a;
      --border-2: #42424a;
      --text: #dcdce0;
      --text-2: #9a9aa3;
      --text-3: #6a6a73;
      --accent: #7aa2f7;
      --accent-soft: rgba(122, 162, 247, 0.14);
      --radius: 6px;
      --radius-sm: 4px;
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    .app {
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      flex-shrink: 0;
      padding: 0.85rem 1.25rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .title-wrap {
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
      min-width: 0;
    }

    .title {
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .title-sub {
      color: var(--text-3);
      font-size: 0.78rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-actions {
      display: flex;
      gap: 0.35rem;
      align-items: center;
      flex-shrink: 0;
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 22rem;
      min-height: 0;
    }

    @media (max-width: 880px) {
      main {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto;
        overflow: auto;
      }

      body {
        overflow: auto;
      }

      .app {
        height: auto;
        min-height: 100dvh;
      }
    }

    .panel {
      padding: 1.1rem 1.25rem;
      overflow: auto;
      min-width: 0;
    }

    .picker {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    .model-tabs {
      display: flex;
      gap: 0.15rem;
      flex-wrap: wrap;
    }

    .text-btn {
      background: transparent;
      border: none;
      color: var(--text-2);
      font: inherit;
      font-size: 0.85rem;
      padding: 0.35rem 0.7rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: color 0.15s;
      letter-spacing: 0.01em;
    }

    .text-btn:hover {
      color: var(--text);
    }

    .text-btn.active {
      color: var(--accent);
    }

    .outline-btn {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 0.35rem 0.8rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font: inherit;
      font-size: 0.85rem;
      transition: background 0.15s;
    }

    .outline-btn:hover {
      background: var(--accent-soft);
    }

    .plane-info {
      display: flex;
      gap: 1.2rem;
      font-size: 0.72rem;
      color: var(--text-3);
      letter-spacing: 0.04em;
    }

    .plane-info b {
      color: var(--text-2);
      font-weight: 500;
      font-family: 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
      margin-left: 0.3rem;
    }

    .plane-axis {
      display: grid;
      grid-template-columns: 1fr 1.5rem;
      gap: 0.6rem;
      height: clamp(14rem, 40vh, 22rem);
    }

    .plane-wrap,
    .axis-wrap {
      position: relative;
      border-radius: var(--radius-sm);
      overflow: hidden;
      border: 1px solid var(--border);
      touch-action: none;
      user-select: none;
      background: #000;
    }

    .plane-canvas,
    .axis-canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }

    .plane-cursor {
      position: absolute;
      width: 0.85rem;
      height: 0.85rem;
      border: 1.5px solid #fff;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      box-sizing: border-box;
      mix-blend-mode: difference;
    }

    .axis-cursor {
      position: absolute;
      left: -2px;
      right: -2px;
      height: 2px;
      background: #fff;
      transform: translateY(-50%);
      pointer-events: none;
      mix-blend-mode: difference;
    }

    .hex-row {
      display: flex;
      gap: 0.5rem;
      align-items: stretch;
    }

    .swatch {
      width: 2.2rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      flex-shrink: 0;
    }

    .input {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font: inherit;
      padding: 0.45rem 0.65rem;
      border-radius: var(--radius-sm);
      outline: none;
      transition: border-color 0.15s;
      font-family: 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
      font-size: 0.85rem;
      width: 100%;
      min-width: 0;
    }

    .input:focus {
      border-color: var(--accent);
    }

    .hex-input {
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
      border-left: 1px solid var(--border);
    }

    @media (max-width: 880px) {
      .controls {
        border-left: none;
        border-top: 1px solid var(--border);
      }
    }

    .section {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .section-label {
      font-size: 0.7rem;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 500;
    }

    .slider-group {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }

    .slider-row {
      display: grid;
      grid-template-columns: 1.2rem 1fr 4.5rem;
      gap: 0.5rem;
      align-items: center;
    }

    .slider-label {
      font-size: 0.8rem;
      color: var(--text-2);
      font-family: 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
      text-align: center;
    }

    .slider-track-wrap {
      position: relative;
      height: 1.4rem;
      display: flex;
      align-items: center;
    }

    .slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 0.7rem;
      background: transparent;
      cursor: pointer;
      outline: none;
      padding: 0;
      margin: 0;
    }

    .slider::-webkit-slider-runnable-track {
      height: 0.7rem;
      border-radius: 0.35rem;
      border: 1px solid var(--border);
      background: var(--track-bg, var(--surface-2));
    }

    .slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 0.55rem;
      height: 1.1rem;
      margin-top: -0.3rem;
      border-radius: 2px;
      background: #fff;
      border: 1px solid rgba(0, 0, 0, 0.5);
      cursor: pointer;
    }

    .slider::-moz-range-track {
      height: 0.7rem;
      border-radius: 0.35rem;
      border: 1px solid var(--border);
      background: var(--track-bg, var(--surface-2));
    }

    .slider::-moz-range-thumb {
      width: 0.55rem;
      height: 1.1rem;
      border-radius: 2px;
      background: #fff;
      border: 1px solid rgba(0, 0, 0, 0.5);
      cursor: pointer;
    }

    .slider-input {
      text-align: right;
      font-family: 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
      font-size: 0.8rem;
      padding: 0.35rem 0.45rem;
    }

    .slider-input::-webkit-outer-spin-button,
    .slider-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .slider-input {
      appearance: textfield;
    }

    .values-list {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }

    .value-row {
      display: grid;
      grid-template-columns: 2.6rem 1fr;
      gap: 0.6rem;
      align-items: center;
      font-size: 0.8rem;
      padding: 0.3rem 0.4rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background 0.15s;
    }

    .value-row:hover {
      background: var(--surface);
    }

    .value-key {
      color: var(--text-3);
      font-family: 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
      font-size: 0.72rem;
      letter-spacing: 0.05em;
    }

    .value-val {
      color: var(--text);
      font-family: 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
      text-align: right;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .preview-block {
      height: 3.5rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
    }

    .toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--surface-2);
      border: 1px solid var(--border-2);
      color: var(--text);
      padding: 0.5rem 1rem;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 100;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>

<body>
  <div class="app">
    <header>
      <div class="title-wrap">
        <span class="title">调色板</span>
        <span class="title-sub"></span>
      </div>
      <div class="header-actions">
        <button class="text-btn" id="randomBtn">随机</button>
        <button class="text-btn" id="resetBtn">重置</button>
        <button class="outline-btn" id="copyHexBtn">复制 HEX</button>
      </div>
    </header>
    <main>
      <section class="panel picker">
        <div class="model-tabs" id="modelTabs"></div>
        <div class="plane-info">
          <span>平面<b id="planeInfoText"></b></span>
          <span>主轴<b id="axisInfoText"></b></span>
        </div>
        <div class="plane-axis">
          <div class="plane-wrap" id="planeWrap">
            <canvas class="plane-canvas" id="planeCanvas"></canvas>
            <div class="plane-cursor" id="planeCursor"></div>
          </div>
          <div class="axis-wrap" id="axisWrap">
            <canvas class="axis-canvas" id="axisCanvas"></canvas>
            <div class="axis-cursor" id="axisCursor"></div>
          </div>
        </div>
        <div class="hex-row">
          <div class="swatch" id="swatch"></div>
          <input class="input hex-input" id="hexInput" type="text" value="#7AA2F7" spellcheck="false"
            autocomplete="off" />
        </div>
      </section>
      <aside class="panel controls">
        <div class="section">
          <div class="section-label">3 轴微调</div>
          <div class="slider-group" id="sliderGroup"></div>
        </div>
        <div class="section">
          <div class="section-label">各模型数值 · 点击复制</div>
          <div class="values-list" id="valuesList"></div>
        </div>
        <div class="section">
          <div class="section-label">预览</div>
          <div class="preview-block" id="previewBlock"></div>
        </div>
      </aside>
    </main>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    // ========== 颜色转换（输入输出均为归一化 RGB 0-1，除特殊说明） ==========
    function hsv2rgb(h, s, v) {
      h = ((h % 360) + 360) % 360;
      const c = v * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = v - c;
      let r, g, b;
      if (h < 60) { r = c; g = x; b = 0; }
      else if (h < 120) { r = x; g = c; b = 0; }
      else if (h < 180) { r = 0; g = c; b = x; }
      else if (h < 240) { r = 0; g = x; b = c; }
      else if (h < 300) { r = x; g = 0; b = c; }
      else { r = c; g = 0; b = x; }
      return [r + m, g + m, b + m];
    }
    function rgb2hsv(r, g, b) {
      const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
      let h = 0;
      if (d > 1e-9) {
        if (mx === r) h = ((g - b) / d) % 6;
        else if (mx === g) h = (b - r) / d + 2;
        else h = (r - g) / d + 4;
        h *= 60; if (h < 0) h += 360;
      }
      const s = mx < 1e-9 ? 0 : d / mx;
      return [h, s, mx];
    }
    function hsl2rgb(h, s, l) {
      h = ((h % 360) + 360) % 360;
      const c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = l - c / 2;
      let r, g, b;
      if (h < 60) { r = c; g = x; b = 0; }
      else if (h < 120) { r = x; g = c; b = 0; }
      else if (h < 180) { r = 0; g = c; b = x; }
      else if (h < 240) { r = 0; g = x; b = c; }
      else if (h < 300) { r = x; g = 0; b = c; }
      else { r = c; g = 0; b = x; }
      return [r + m, g + m, b + m];
    }
    function rgb2hsl(r, g, b) {
      const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2;
      let h = 0, s = 0;
      if (mx - mn > 1e-9) {
        const d = mx - mn;
        s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
        if (mx === r) h = ((g - b) / d) + (g < b ? 6 : 0);
        else if (mx === g) h = (b - r) / d + 2;
        else h = (r - g) / d + 4;
        h *= 60;
      }
      return [h, s, l];
    }
    function hwb2rgb(h, w, b) {
      if (w + b >= 1) { const g = w / (w + b); return [g, g, g]; }
      const [r, g_, bl] = hsv2rgb(h, 1, 1);
      const f = 1 - w - b;
      return [r * f + w, g_ * f + w, bl * f + w];
    }
    function rgb2hwb(r, g, b) {
      const [h] = rgb2hsv(r, g, b);
      return [h, Math.min(r, g, b), 1 - Math.max(r, g, b)];
    }
    function srgb2linear(c) { return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }
    function linear2srgb(c) { return c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - 0.055; }
    function lab2rgb(L, a, b) {
      const eps = 0.008856, kappa = 903.3;
      const fy = (L + 16) / 116, fx = a / 500 + fy, fz = fy - b / 200;
      const xr = Math.pow(fx, 3) > eps ? Math.pow(fx, 3) : (116 * fx - 16) / kappa;
      const yr = L > kappa * eps ? Math.pow((L + 16) / 116, 3) : L / kappa;
      const zr = Math.pow(fz, 3) > eps ? Math.pow(fz, 3) : (116 * fz - 16) / kappa;
      const X = xr * 0.95047, Y = yr * 1.0, Z = zr * 1.08883;
      let r = 3.2404542 * X - 1.5371385 * Y - 0.4985314 * Z;
      let g = -0.9692660 * X + 1.8760108 * Y + 0.0415560 * Z;
      let bl = 0.0556434 * X - 0.2040259 * Y + 1.0572252 * Z;
      return [linear2srgb(r), linear2srgb(g), linear2srgb(bl)];
    }
    function rgb2lab(r, g, b) {
      const rl = srgb2linear(r), gl = srgb2linear(g), bl = srgb2linear(b);
      const X = 0.4124564 * rl + 0.3575761 * gl + 0.1804375 * bl;
      const Y = 0.2126729 * rl + 0.7151522 * gl + 0.0721750 * bl;
      const Z = 0.0193339 * rl + 0.1191920 * gl + 0.9503041 * bl;
      const xr = X / 0.95047, yr = Y / 1.0, zr = Z / 1.08883;
      const eps = 0.008856, kappa = 903.3;
      const fx = xr > eps ? Math.cbrt(xr) : (kappa * xr + 16) / 116;
      const fy = yr > eps ? Math.cbrt(yr) : (kappa * yr + 16) / 116;
      const fz = zr > eps ? Math.cbrt(zr) : (kappa * zr + 16) / 116;
      return [116 * fy - 16, 500 * (fx - fy), 200 * (fy - fz)];
    }
    function lab2lch(L, a, b) {
      const C = Math.sqrt(a * a + b * b);
      let H = Math.atan2(b, a) * 180 / Math.PI; if (H < 0) H += 360;
      return [L, C, H];
    }
    function lch2lab(L, C, H) { const h = H * Math.PI / 180; return [L, C * Math.cos(h), C * Math.sin(h)]; }
    function lch2rgb(L, C, H) { const [l, a, b] = lch2lab(L, C, H); return lab2rgb(l, a, b); }
    function rgb2lch(r, g, b) { const [L, a, b_] = rgb2lab(r, g, b); return lab2lch(L, a, b_); }

    // ========== 工具 ==========
    function clamp01(x) { x = +x; if (!isFinite(x)) return 0; return Math.max(0, Math.min(1, x)); }
    function clamp(v, mn, mx) { return Math.max(mn, Math.min(mx, v)); }
    function round1(x) { return Math.round(x * 10) / 10; }
    function fmtNum(v, step) {
      if (step >= 1) return String(Math.round(v));
      if (step >= 0.1) return String(Math.round(v * 10) / 10);
      return String(Math.round(v * 100) / 100);
    }
    function rgbToHex(rgb) {
      const h = c => Math.round(clamp01(c) * 255).toString(16).padStart(2, '0');
      return '#' + h(rgb[0]) + h(rgb[1]) + h(rgb[2]);
    }
    function hexToRgb(hex) {
      hex = hex.trim().replace(/^#/, '');
      if (hex.length === 3) hex = hex[0] + hex[0] + hex[1] + hex[1] + hex[2] + hex[2];
      if (hex.length !== 6 || !/^[0-9a-fA-F]{6}$/.test(hex)) return null;
      return [parseInt(hex.slice(0, 2), 16) / 255, parseInt(hex.slice(2, 4), 16) / 255, parseInt(hex.slice(4, 6), 16) / 255];
    }

    // ========== 模型定义 ==========
    const MODELS = {
      rgb: {
        name: 'RGB',
        channels: [
          { name: 'R', min: 0, max: 255, step: 1 },
          { name: 'G', min: 0, max: 255, step: 1 },
          { name: 'B', min: 0, max: 255, step: 1 },
        ],
        axis: 0, plane: [1, 2],
        toRgb: v => [v[0] / 255, v[1] / 255, v[2] / 255],
        fromRgb: r => [r[0] * 255, r[1] * 255, r[2] * 255],
        fmt: v => v.map(x => Math.round(x)).join(', '),
      },
      hsv: {
        name: 'HSV',
        channels: [
          { name: 'H', min: 0, max: 360, step: 0.1 },
          { name: 'S', min: 0, max: 100, step: 0.1 },
          { name: 'V', min: 0, max: 100, step: 0.1 },
        ],
        axis: 0, plane: [1, 2], axisRef: { 1: 100, 2: 100 },
        toRgb: v => hsv2rgb(v[0], v[1] / 100, v[2] / 100),
        fromRgb: r => { const h = rgb2hsv(r[0], r[1], r[2]); return [h[0], h[1] * 100, h[2] * 100]; },
        fmt: v => `${round1(v[0])}°, ${round1(v[1])}%, ${round1(v[2])}%`,
      },
      hsl: {
        name: 'HSL',
        channels: [
          { name: 'H', min: 0, max: 360, step: 0.1 },
          { name: 'S', min: 0, max: 100, step: 0.1 },
          { name: 'L', min: 0, max: 100, step: 0.1 },
        ],
        axis: 0, plane: [1, 2], axisRef: { 1: 100, 2: 50 },
        toRgb: v => hsl2rgb(v[0], v[1] / 100, v[2] / 100),
        fromRgb: r => { const h = rgb2hsl(r[0], r[1], r[2]); return [h[0], h[1] * 100, h[2] * 100]; },
        fmt: v => `${round1(v[0])}°, ${round1(v[1])}%, ${round1(v[2])}%`,
      },
      hwb: {
        name: 'HWB',
        channels: [
          { name: 'H', min: 0, max: 360, step: 0.1 },
          { name: 'W', min: 0, max: 100, step: 0.1 },
          { name: 'B', min: 0, max: 100, step: 0.1 },
        ],
        axis: 0, plane: [1, 2], axisRef: { 1: 0, 2: 0 },
        toRgb: v => hwb2rgb(v[0], v[1] / 100, v[2] / 100),
        fromRgb: r => { const h = rgb2hwb(r[0], r[1], r[2]); return [h[0], h[1] * 100, h[2] * 100]; },
        fmt: v => `${round1(v[0])}°, ${round1(v[1])}%, ${round1(v[2])}%`,
      },
      lch: {
        name: 'LCH',
        channels: [
          { name: 'L', min: 0, max: 100, step: 0.1 },
          { name: 'C', min: 0, max: 150, step: 0.1 },
          { name: 'H', min: 0, max: 360, step: 0.1 },
        ],
        axis: 0, plane: [1, 2],
        toRgb: v => lch2rgb(v[0], v[1], v[2]),
        fromRgb: r => rgb2lch(r[0], r[1], r[2]),
        fmt: v => `${round1(v[0])}%, ${round1(v[1])}, ${round1(v[2])}°`,
      },
      lab: {
        name: 'LAB',
        channels: [
          { name: 'L', min: 0, max: 100, step: 0.1 },
          { name: 'a', min: -125, max: 125, step: 0.1 },
          { name: 'b', min: -125, max: 125, step: 0.1 },
        ],
        axis: 0, plane: [1, 2],
        toRgb: v => lab2rgb(v[0], v[1], v[2]),
        fromRgb: r => rgb2lab(r[0], r[1], r[2]),
        fmt: v => `${round1(v[0])}%, ${round1(v[1])}, ${round1(v[2])}`,
      },
    };

    // ========== 状态 ==========
    // 直接维护当前模型的数值，避免由于色域截断导致往返转换不一致
    const state = {
      model: 'hsl',
      modelVals: MODELS.hsl.fromRgb(hexToRgb('#7AA2F7'))
    };

    function getCurrentRgb() {
      return MODELS[state.model].toRgb(state.modelVals).map(clamp01);
    }

    // ========== DOM ==========
    const els = {
      modelTabs: document.getElementById('modelTabs'),
      planeCanvas: document.getElementById('planeCanvas'),
      axisCanvas: document.getElementById('axisCanvas'),
      planeCursor: document.getElementById('planeCursor'),
      axisCursor: document.getElementById('axisCursor'),
      planeWrap: document.getElementById('planeWrap'),
      axisWrap: document.getElementById('axisWrap'),
      planeInfoText: document.getElementById('planeInfoText'),
      axisInfoText: document.getElementById('axisInfoText'),
      swatch: document.getElementById('swatch'),
      hexInput: document.getElementById('hexInput'),
      sliderGroup: document.getElementById('sliderGroup'),
      valuesList: document.getElementById('valuesList'),
      previewBlock: document.getElementById('previewBlock'),
      toast: document.getElementById('toast'),
      randomBtn: document.getElementById('randomBtn'),
      resetBtn: document.getElementById('resetBtn'),
      copyHexBtn: document.getElementById('copyHexBtn'),
    };

    // ========== 构建模型标签 ==========
    function buildModelTabs() {
      els.modelTabs.innerHTML = '';
      Object.entries(MODELS).forEach(([key, def]) => {
        const btn = document.createElement('button');
        btn.className = 'text-btn' + (key === state.model ? ' active' : '');
        btn.textContent = def.name;
        btn.dataset.model = key;
        btn.addEventListener('click', () => setModel(key));
        els.modelTabs.appendChild(btn);
      });
    }

    // ========== 构建滑块 ==========
    let sliderEls = [];
    function buildSliders() {
      const def = MODELS[state.model];
      els.sliderGroup.innerHTML = '';
      sliderEls = [];
      def.channels.forEach((ch, i) => {
        const row = document.createElement('div');
        row.className = 'slider-row';
        row.innerHTML = `
      <span class="slider-label">${ch.name}</span>
      <div class="slider-track-wrap">
        <input type="range" class="slider" min="${ch.min}" max="${ch.max}" step="${ch.step}" value="0" data-idx="${i}" />
      </div>
      <input type="number" class="input slider-input" min="${ch.min}" max="${ch.max}" step="${ch.step}" value="0" data-idx="${i}" />
    `;
        els.sliderGroup.appendChild(row);
        const slider = row.querySelector('.slider');
        const numInput = row.querySelector('.slider-input');
        sliderEls.push({ slider, numInput });
        slider.addEventListener('input', () => {
          const v = parseFloat(slider.value);
          numInput.value = fmtNum(v, ch.step);
          onChannelChange(i, v);
        });
        numInput.addEventListener('change', () => {
          let v = parseFloat(numInput.value);
          if (!isFinite(v)) v = ch.min;
          v = clamp(v, ch.min, ch.max);
          slider.value = v;
          numInput.value = fmtNum(v, ch.step);
          onChannelChange(i, v);
        });
      });
    }

    function onChannelChange(idx, value) {
      state.modelVals[idx] = value;
      render({ redrawPlane: true, redrawAxis: true });
    }

    // ========== 构建数值列表 ==========
    function buildValuesList() {
      els.valuesList.innerHTML = '';
      Object.entries(MODELS).forEach(([key, def]) => {
        const row = document.createElement('div');
        row.className = 'value-row';
        row.dataset.model = key;
        row.innerHTML = `<span class="value-key">${def.name}</span><span class="value-val"></span>`;
        row.addEventListener('click', () => copyText(def.fmt(def.fromRgb(getCurrentRgb()))));
        els.valuesList.appendChild(row);
      });
    }

    // ========== Canvas 尺寸 ==========
    function setupCanvas(canvas) {
      const rect = canvas.getBoundingClientRect();
      const maxPx = 160;
      const w = Math.max(40, Math.min(maxPx, Math.round(rect.width)));
      const h = Math.max(40, Math.min(maxPx, Math.round(rect.height)));
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w; canvas.height = h;
      }
    }

    // ========== 绘制 2D 平面 ==========
    function drawPlane() {
      const def = MODELS[state.model];
      const canvas = els.planeCanvas;
      setupCanvas(canvas);
      const ctx = canvas.getContext('2d');
      const w = canvas.width, h = canvas.height;
      const [px, py] = def.plane;
      const axisIdx = def.axis;
      const xCh = def.channels[px], yCh = def.channels[py];
      const modelVals = state.modelVals.slice();
      const axisVal = modelVals[axisIdx];
      const img = ctx.createImageData(w, h);
      const data = img.data;
      const xvArr = new Float32Array(w);
      const yvArr = new Float32Array(h);
      for (let x = 0; x < w; x++) xvArr[x] = xCh.min + (xCh.max - xCh.min) * (x / (w - 1));
      for (let y = 0; y < h; y++) yvArr[y] = yCh.min + (yCh.max - yCh.min) * (1 - y / (h - 1));
      const vals = modelVals;
      vals[axisIdx] = axisVal;
      for (let y = 0; y < h; y++) {
        vals[py] = yvArr[y];
        for (let x = 0; x < w; x++) {
          vals[px] = xvArr[x];
          const rgb = def.toRgb(vals);
          const idx = (y * w + x) * 4;
          data[idx] = clamp01(rgb[0]) * 255;
          data[idx + 1] = clamp01(rgb[1]) * 255;
          data[idx + 2] = clamp01(rgb[2]) * 255;
          data[idx + 3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
    }

    // ========== 绘制主轴 ==========
    function drawAxis() {
      const def = MODELS[state.model];
      const canvas = els.axisCanvas;
      setupCanvas(canvas);
      const ctx = canvas.getContext('2d');
      const w = canvas.width, h = canvas.height;
      const axisIdx = def.axis;
      const axisCh = def.channels[axisIdx];
      const modelVals = state.modelVals.slice();
      if (def.axisRef) for (const k in def.axisRef) modelVals[k] = def.axisRef[k];
      const img = ctx.createImageData(w, h);
      const data = img.data;
      const vals = modelVals;
      for (let y = 0; y < h; y++) {
        vals[axisIdx] = axisCh.min + (axisCh.max - axisCh.min) * (1 - y / (h - 1));
        const rgb = def.toRgb(vals);
        const r = clamp01(rgb[0]) * 255, g = clamp01(rgb[1]) * 255, b = clamp01(rgb[2]) * 255;
        for (let x = 0; x < w; x++) {
          const idx = (y * w + x) * 4;
          data[idx] = r; data[idx + 1] = g; data[idx + 2] = b; data[idx + 3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
    }

    // ========== 更新指示器 ==========
    function updatePlaneCursor() {
      const def = MODELS[state.model];
      const [px, py] = def.plane;
      const xCh = def.channels[px], yCh = def.channels[py];
      const v = state.modelVals;
      const nx = (v[px] - xCh.min) / (xCh.max - xCh.min);
      const ny = 1 - (v[py] - yCh.min) / (yCh.max - yCh.min);
      els.planeCursor.style.left = (nx * 100) + '%';
      els.planeCursor.style.top = (ny * 100) + '%';
    }
    function updateAxisCursor() {
      const def = MODELS[state.model];
      const axisIdx = def.axis;
      const ch = def.channels[axisIdx];
      const v = state.modelVals;
      const ny = 1 - (v[axisIdx] - ch.min) / (ch.max - ch.min);
      els.axisCursor.style.top = (ny * 100) + '%';
    }

    // ========== 更新滑块 ==========
    function updateSliders() {
      const def = MODELS[state.model];
      const modelVals = state.modelVals;
      sliderEls.forEach((s, i) => {
        const ch = def.channels[i];
        const v = modelVals[i];
        s.slider.value = v;
        s.numInput.value = fmtNum(v, ch.step);
        updateSliderTrack(i);
      });
    }
    function updateSliderTrack(idx) {
      const def = MODELS[state.model];
      const ch = def.channels[idx];
      const N = 8;
      const stops = [];
      for (let k = 0; k <= N; k++) {
        const v = ch.min + (ch.max - ch.min) * (k / N);
        const vals = state.modelVals.slice();
        vals[idx] = v;
        const rgb = def.toRgb(vals).map(clamp01);
        stops.push(`rgb(${Math.round(rgb[0] * 255)},${Math.round(rgb[1] * 255)},${Math.round(rgb[2] * 255)})`);
      }
      sliderEls[idx].slider.style.setProperty('--track-bg', `linear-gradient(to right, ${stops.join(',')})`);
    }

    // ========== 更新数值列表 / HEX / 预览 ==========
    function updateValuesList() {
      const currentRgb = getCurrentRgb();
      Object.entries(MODELS).forEach(([key, def]) => {
        const row = els.valuesList.querySelector(`[data-model="${key}"]`);
        if (row) row.querySelector('.value-val').textContent = def.fmt(def.fromRgb(currentRgb));
      });
    }
    function updateHexInput() { els.hexInput.value = rgbToHex(getCurrentRgb()).toUpperCase(); }
    function updatePreview() {
      const hex = rgbToHex(getCurrentRgb());
      els.swatch.style.background = hex;
      els.previewBlock.style.background = hex;
    }
    function updatePlaneInfo() {
      const def = MODELS[state.model];
      const [px, py] = def.plane;
      els.planeInfoText.textContent = `${def.channels[px].name} × ${def.channels[py].name}`;
      els.axisInfoText.textContent = def.channels[def.axis].name;
    }

    // ========== 渲染（rAF 合并） ==========
    let rafId = null, pending = null;
    function render(opts = {}) {
      pending = opts;
      if (rafId) return;
      rafId = requestAnimationFrame(() => {
        rafId = null;
        const o = pending || {};
        if (o.redrawPlane !== false) drawPlane();
        if (o.redrawAxis !== false) drawAxis();
        updatePlaneCursor();
        updateAxisCursor();
        updateSliders();
        updateValuesList();
        updateHexInput();
        updatePreview();
        updatePlaneInfo();
      });
    }

    // ========== 拖动交互 ==========
    // 事件绑定在外层 wrap 上，坐标基于内层 canvas 计算，避免 cursor 阻挡
    function setupDrag(element, canvas, onMove) {
      let dragging = false;
      const getNorm = (e) => {
        const rect = canvas.getBoundingClientRect();
        const p = e.touches && e.touches[0] ? e.touches[0] : e;
        return {
          x: clamp((p.clientX - rect.left) / rect.width, 0, 1),
          y: clamp((p.clientY - rect.top) / rect.height, 0, 1)
        };
      };
      const start = (e) => { dragging = true; const p = getNorm(e); onMove(p.x, p.y); e.preventDefault(); };
      const move = (e) => { if (!dragging) return; const p = getNorm(e); onMove(p.x, p.y); e.preventDefault(); };
      const end = () => { dragging = false; };
      element.addEventListener('mousedown', start);
      element.addEventListener('touchstart', start, { passive: false });
      window.addEventListener('mousemove', move);
      window.addEventListener('touchmove', move, { passive: false });
      window.addEventListener('mouseup', end);
      window.addEventListener('touchend', end);
      window.addEventListener('touchcancel', end);
    }

    setupDrag(els.planeWrap, els.planeCanvas, (nx, ny) => {
      const def = MODELS[state.model];
      const [px, py] = def.plane;
      const xCh = def.channels[px], yCh = def.channels[py];
      state.modelVals[px] = xCh.min + (xCh.max - xCh.min) * nx;
      state.modelVals[py] = yCh.min + (yCh.max - yCh.min) * (1 - ny);
      render({ redrawPlane: false, redrawAxis: true });
    });

    setupDrag(els.axisWrap, els.axisCanvas, (nx, ny) => {
      const def = MODELS[state.model];
      const axisIdx = def.axis;
      const ch = def.channels[axisIdx];
      state.modelVals[axisIdx] = ch.min + (ch.max - ch.min) * (1 - ny);
      render({ redrawPlane: true, redrawAxis: false });
    });

    // ========== HEX 输入 ==========
    els.hexInput.addEventListener('change', () => {
      const rgb = hexToRgb(els.hexInput.value);
      if (rgb) {
        state.modelVals = MODELS[state.model].fromRgb(rgb);
        render({ redrawPlane: true, redrawAxis: true });
      }
      else updateHexInput();
    });
    els.hexInput.addEventListener('keydown', e => { if (e.key === 'Enter') els.hexInput.blur(); });

    // ========== 模型切换 ==========
    function setModel(model) {
      const rgb = getCurrentRgb();
      state.model = model;
      state.modelVals = MODELS[model].fromRgb(rgb);
      els.modelTabs.querySelectorAll('.text-btn').forEach(b => b.classList.toggle('active', b.dataset.model === model));
      buildSliders();
      render({ redrawPlane: true, redrawAxis: true });
    }

    // ========== 复制 / Toast ==========
    function copyText(text) {
      if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => showToast('已复制 ' + text));
      else {
        const ta = document.createElement('textarea');
        ta.value = text; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); } catch (e) { }
        document.body.removeChild(ta);
        showToast('已复制 ' + text);
      }
    }
    let toastTimer = null;
    function showToast(msg) {
      els.toast.textContent = msg;
      els.toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => els.toast.classList.remove('show'), 1500);
    }

    // ========== 随机 / 重置 / 复制 HEX ==========
    els.randomBtn.addEventListener('click', () => {
      const rgb = [Math.random(), Math.random(), Math.random()];
      state.modelVals = MODELS[state.model].fromRgb(rgb);
      render({ redrawPlane: true, redrawAxis: true });
    });
    els.resetBtn.addEventListener('click', () => {
      const rgb = hexToRgb('#7AA2F7');
      state.modelVals = MODELS[state.model].fromRgb(rgb);
      render({ redrawPlane: true, redrawAxis: true });
    });
    els.copyHexBtn.addEventListener('click', () => copyText(rgbToHex(getCurrentRgb()).toUpperCase()));

    // ========== Resize ==========
    let resizeTimer = null;
    const ro = new ResizeObserver(() => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => render({ redrawPlane: true, redrawAxis: true }), 80);
    });
    ro.observe(els.planeWrap);
    ro.observe(els.axisWrap);

    // ========== 初始化 ==========
    buildModelTabs();
    buildSliders();
    buildValuesList();
    render({ redrawPlane: true, redrawAxis: true });
  </script>
</body>

</html>
