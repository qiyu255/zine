<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>化学元素周期表</title>
<style>
:root {
  --bg_h: #1d2021;
  --bg:   #282828;
  --bg_s: #32302f;
  --bg1:  #3c3836;
  --bg2:  #504945;
  --bg3:  #665c54;
  --bg4:  #7c6f64;
  --fg:  #fbf1c7;
  --fg1: #ebdbb2;
  --fg2: #d5c4a1;
  --fg3: #bdae93;
  --fg4: #a89984;
  --red:    #fb4934;
  --green:  #b8bb26;
  --yellow: #fabd2f;
  --blue:   #83a598;
  --purple: #d3869b;
  --aqua:   #8ec07c;
  --gray:   #928374;
  --orange: #fe8019;
  --red-dim:    #cc2412;
  --green-dim:  #98971a;
  --yellow-dim: #d79921;
  --blue-dim:   #458588;
  --purple-dim: #b16286;
  --aqua-dim:   #689d6a;
  --gray-dim:   #a89984;
  --orange-dim: #d65d0e;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg_h);
  color: var(--fg1);
  font-family: 'Segoe UI', system-ui, sans-serif;
  min-height: 100vh;
  padding: 20px 12px 32px;
}

h1 {
  text-align: center;
  font-size: 22px;
  font-weight: 500;
  color: var(--fg);
  letter-spacing: 4px;
  margin-bottom: 6px;
}

.subtitle {
  text-align: center;
  font-size: 12px;
  color: var(--fg4);
  letter-spacing: 2px;
  margin-bottom: 18px;
}

.legend {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px 16px;
  margin-bottom: 18px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  color: var(--fg3);
}

.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 2px;
  flex-shrink: 0;
}

.table-wrapper {
  overflow-x: auto;
  padding-bottom: 4px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(18, 52px);
  grid-template-rows: repeat(10, auto);
  gap: 3px;
  min-width: 954px;
  margin: 0 auto;
  width: fit-content;
}

.cell {
  width: 52px;
  height: 68px;
  border-radius: 4px;
  padding: 3px 4px 2px;
  cursor: default;
  position: relative;
  transition: transform 0.12s, box-shadow 0.12s;
  border: 1px solid rgba(0,0,0,0.3);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
}

.cell:hover {
  transform: scale(1.18);
  z-index: 100;
  box-shadow: 0 4px 20px rgba(0,0,0,0.6);
}

.cell .num {
  font-size: 9px;
  color: rgba(255,255,255,0.55);
  align-self: flex-start;
  line-height: 1;
}

.cell .sym {
  font-size: 18px;
  font-weight: 600;
  color: #fff;
  line-height: 1.1;
  margin-top: 1px;
}

.cell .cn {
  font-size: 10px;
  color: rgba(255,255,255,0.85);
  line-height: 1.1;
}

.cell .py {
  font-size: 8px;
  color: rgba(255,255,255,0.5);
  line-height: 1.1;
}

.cell .mass {
  font-size: 8px;
  color: rgba(255,255,255,0.5);
  margin-top: auto;
  line-height: 1;
}

.period-label {
  width: 52px;
  height: 68px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  color: var(--fg4);
}

.group-label {
  height: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  color: var(--fg4);
}

.spacer { width: 52px; height: 68px; }

.lanthanide-note {
  width: 52px;
  height: 68px;
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 600;
  border: 1px dashed rgba(255,255,255,0.2);
}

.series-label {
  grid-column: 1 / 3;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding-right: 8px;
  font-size: 11px;
  color: var(--fg4);
}

/* Element categories → colors */
.alkali-metal      { background: #7c2d12; border-color: #9a3412; }
.alkaline-earth    { background: #713f12; border-color: #854d0e; }
.transition-metal  { background: #1e3a5f; border-color: #1d4ed8; }
.post-transition   { background: #134e4a; border-color: #0f766e; }
.metalloid         { background: #3b2f00; border-color: #78580a; }
.nonmetal          { background: #14532d; border-color: #166534; }
.halogen           { background: #4a044e; border-color: #7e22ce; }
.noble-gas         { background: #1e1b4b; border-color: #4338ca; }
.lanthanide        { background: #4c0519; border-color: #9f1239; }
.actinide          { background: #1c1917; border-color: #57534e; }
.unknown           { background: #1c1917; border-color: #57534e; }

.alkali-metal .sym      { color: #fed7aa; }
.alkaline-earth .sym    { color: #fde68a; }
.transition-metal .sym  { color: #bfdbfe; }
.post-transition .sym   { color: #99f6e4; }
.metalloid .sym         { color: #fef08a; }
.nonmetal .sym          { color: #bbf7d0; }
.halogen .sym           { color: #e9d5ff; }
.noble-gas .sym         { color: #c7d2fe; }
.lanthanide .sym        { color: #fecdd3; }
.actinide .sym          { color: #d6d3d1; }
.unknown .sym           { color: #d6d3d1; }

.legend-dot.alkali-metal    { background: #7c2d12; }
.legend-dot.alkaline-earth  { background: #713f12; }
.legend-dot.transition-metal{ background: #1e3a5f; }
.legend-dot.post-transition { background: #134e4a; }
.legend-dot.metalloid       { background: #3b2f00; }
.legend-dot.nonmetal        { background: #14532d; }
.legend-dot.halogen         { background: #4a044e; }
.legend-dot.noble-gas       { background: #1e1b4b; }
.legend-dot.lanthanide      { background: #4c0519; }
.legend-dot.actinide        { background: #1c1917; border: 1px solid #57534e; }

.series-row {
  display: grid;
  grid-template-columns: 104px repeat(15, 52px);
  gap: 3px;
  min-width: 954px;
  margin: 0 auto;
  width: fit-content;
}

.series-separator {
  height: 12px;
}
</style>
</head>

  {n:94,  sym:'Pu', cn:'钚',  py:'bù',   mass:'[244]', cat:'actinide'},
  {n:95,  sym:'Am', cn:'镅',  py:'méi',  mass:'[243]', cat:'actinide'},
  {n:96,  sym:'Cm', cn:'锔',  py:'jú',   mass:'[247]', cat:'actinide'},
  {n:97,  sym:'Bk', cn:'锫',  py:'péi',  mass:'[247]', cat:'actinide'},
  {n:98,  sym:'Cf', cn:'锎',  py:'kāi',  mass:'[251]', cat:'actinide'},
  {n:99,  sym:'Es', cn:'锿',  py:'āi',   mass:'[252]', cat:'actinide'},
  {n:100, sym:'Fm', cn:'镄',  py:'fèi',  mass:'[257]', cat:'actinide'},
  {n:101, sym:'Md', cn:'钔',  py:'mén',  mass:'[258]', cat:'actinide'},
  {n:102, sym:'No', cn:'锘',  py:'nuò',  mass:'[259]', cat:'actinide'},
  {n:103, sym:'Lr', cn:'铹',  py:'láo',  mass:'[262]', cat:'actinide'},
];

function makeCell(el) {
  const d = document.createElement('div');
  d.className = 'cell ' + el.cat;
  d.title = `${el.cn} (${el.sym}) — 原子序数 ${el.n}，相对原子质量 ${el.mass}`;
  d.innerHTML = `<span class="num">${el.n}</span><span class="sym">${el.sym}</span><span class="cn">${el.cn}</span><span class="py">${el.py}</span><span class="mass">${el.mass}</span>`;
  return d;
}

function makeSpacerNote(series, row) {
  const d = document.createElement('div');
  d.className = 'cell ' + (series === 'La' ? 'lanthanide' : 'actinide');
  d.style.opacity = '0.7';
  const label = series === 'La' ? '57–71' : '89–103';
  const cn = series === 'La' ? '镧系' : '锕系';
  d.innerHTML = `<span class="num">&nbsp;</span><span class="sym" style="font-size:12px">${label}</span><span class="cn">${cn}</span>`;
  return d;
}

const ROWS = 7, COLS = 18;
const grid = document.getElementById('main-grid');
grid.style.display = 'grid';
grid.style.gridTemplateColumns = `repeat(${COLS}, 52px)`;
grid.style.gap = '3px';
grid.style.minWidth = '954px';
grid.style.margin = '0 auto';
grid.style.width = 'fit-content';

const cellMap = {};
for (let r = 1; r <= ROWS; r++) {
  for (let c = 1; c <= COLS; c++) {
    cellMap[`${r}-${c}`] = null;
  }
}

elements.forEach(el => {
  const key = `${el.row}-${el.col}`;
  if (el.series) {
    cellMap[key] = makeSpacerNote(el.series, el.row);
  } else {
    cellMap[key] = makeCell(el);
  }
});

for (let r = 1; r <= ROWS; r++) {
  for (let c = 1; c <= COLS; c++) {
    const key = `${r}-${c}`;
    if (cellMap[key]) {
      grid.appendChild(cellMap[key]);
    } else {
      const sp = document.createElement('div');
      sp.className = 'spacer';
      grid.appendChild(sp);
    }
  }
}

function buildSeries(containerId, seriesData, labelText) {
  const container = document.getElementById(containerId);
  const label = document.createElement('div');
  label.style.cssText = 'display:flex;align-items:center;justify-content:flex-end;padding-right:10px;font-size:11px;color:var(--fg4);width:104px;height:68px;flex-shrink:0;';
  label.textContent = labelText;
  container.appendChild(label);
  seriesData.forEach(el => container.appendChild(makeCell(el)));
}

buildSeries('lanthanide-row', lanthanides, '镧系元素');
buildSeries('actinide-row', actinides, '锕系元素');
</script>
