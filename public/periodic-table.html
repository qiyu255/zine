<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>化学元素周期表</title>
<style>
:root {
  --bg_h: #1d2021;
  --bg:   #282828;
  --bg_s: #32302f;
  --bg1:  #3c3836;
  --bg2:  #504945;
  --bg3:  #665c54;
  --bg4:  #7c6f64;
  --fg:  #fbf1c7;
  --fg1: #ebdbb2;
  --fg2: #d5c4a1;
  --fg3: #bdae93;
  --fg4: #a89984;
  --red:    #fb4934;
  --green:  #b8bb26;
  --yellow: #fabd2f;
  --blue:   #83a598;
  --purple: #d3869b;
  --aqua:   #8ec07c;
  --gray:   #928374;
  --orange: #fe8019;
  --red-dim:    #cc2412;
  --green-dim:  #98971a;
  --yellow-dim: #d79921;
  --blue-dim:   #458588;
  --purple-dim: #b16286;
  --aqua-dim:   #689d6a;
  --gray-dim:   #a89984;
  --orange-dim: #d65d0e;

  /* Category colors */
  --cat-alkali:       #fb4934;
  --cat-alkaline:     #fe8019;
  --cat-transition:   #83a598;
  --cat-post-trans:   #8ec07c;
  --cat-metalloid:    #b8bb26;
  --cat-nonmetal:     #fabd2f;
  --cat-halogen:      #d3869b;
  --cat-noble:        #928374;
  --cat-lanthanide:   #689d6a;
  --cat-actinide:     #b16286;
  --cat-unknown:      #665c54;

  --cell-size: clamp(52px, 5.5vw, 76px);
  --gap: clamp(2px, 0.3vw, 4px);
  --border-radius: 4px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { font-size: 16px; }

body {
  background: var(--bg_h);
  color: var(--fg1);
  font-family:
    -apple-system, BlinkMacSystemFont,
    "Segoe UI", Roboto, "Helvetica Neue", Arial,
    "Noto Sans", "Liberation Sans",
    "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
    "WenQuanYi Micro Hei",
    sans-serif;
  min-height: 100vh;
  padding: 1.5rem 1rem 2rem;
  overflow-x: auto;
  min-width: max-content
}

h1 {
  text-align: center;
  font-size: clamp(1rem, 2vw, 1.5rem);
  font-weight: 400;
  letter-spacing: 0.3em;
  color: var(--fg3);
  margin-bottom: 1.2rem;
  text-transform: uppercase;
}

.table-wrap {
  /* display: flex;
  flex-direction: column;
  align-items:  flex-start;
  gap: var(--gap); */
    /* 删除 display: flex 相关属性 */
  width: max-content;  /* 关键：让宽度由内容决定 */
  margin: 0 auto;      /* 如果视口够宽仍然居中 */
}

.grid {
  display: grid;
  grid-template-columns: repeat(18, var(--cell-size));
  grid-template-rows: auto;
  gap: var(--gap);
}

/* Element cell */
.el {
  width: var(--cell-size);
  height: var(--cell-size);
  position: relative;
  /* border-radius: var(--border-radius); */
  padding: clamp(2px, 0.4vw, 5px);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  cursor: default;
  transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
  border: 1px solid rgba(255,255,255,0.06);
  user-select: text;
  overflow: hidden;
}

/* .el:hover {
  transform: scale(1.18);
  z-index: 10;
  box-shadow: 0 4px 20px rgba(0,0,0,0.6);
  filter: brightness(1.25);
} */

/* Row labels */
.period-label {
  width: var(--cell-size);
  height: var(--cell-size);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--fg4);
  font-size: clamp(0.6rem, 0.9vw, 0.75rem);
  font-weight: 600;
  letter-spacing: 0.05em;
}

/* Group labels */
.group-labels {
  display: grid;
  grid-template-columns: repeat(18, var(--cell-size));
  gap: var(--gap);
  margin-bottom: calc(var(--gap) * 0.5);
}
.group-label {
  text-align: center;
  color: var(--fg4);
  font-size: clamp(0.5rem, 0.75vw, 0.65rem);
  letter-spacing: 0.03em;
  padding: 0.1em 0;
}

/* Inner layout */
.el-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  line-height: 1;
}
.el-num {
  font-size: clamp(0.75rem, 0.7vw, 0.65rem);
  color: rgba(255,255,255,0.55);
  font-weight: 400;
  font-variant-numeric: tabular-nums;
}
.el-symbol {
  font-size: 0.75rem;
  /* font-size: clamp(0.75rem, 1.4vw, 1.5rem); */
  /* font-weight: 700; */
  color: #fff;
  letter-spacing: -0.02em;
  line-height: 1;
  text-align: right;
}
.el-name {
  font-size: clamp(1rem, 0.75vw, 0.75rem);
  color: rgba(255,255,255,0.82);
  text-align: center;
  line-height: 1;
  margin: 0;
  /* font-family: system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,sans-serif,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif,"Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol"; */
  font-weight: 500;
}
.el-bottom {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
}
.el-pinyin {
  font-size: clamp(0.75rem, 0.55vw, 0.5rem);
  color: rgba(255,255,255,0.45);
  line-height: 1;
  max-width: 55%;
  /* overflow: hidden; */
  text-overflow: ellipsis;
  white-space: nowrap;
}
.el-mass {
  font-size: clamp(0.45rem, 0.55vw, 0.5rem);
  color: rgba(255,255,255,0.5);
  text-align: right;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

/* Placeholder (empty grid cell) */
.el-empty {
  width: var(--cell-size);
  height: var(--cell-size);
  visibility: hidden;
}

/* Gap row for lanthanides/actinides */
.gap-row {
  height: clamp(6px, 1vw, 12px);
  grid-column: 1 / -1;
}

/* Lanthanide/Actinide series separator labels */
.series-label {
  width: var(--cell-size);
  height: var(--cell-size);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: clamp(0.75rem, 0.6vw, 0.55rem);
  color: var(--fg4);
  text-align: center;
  line-height: 1.3;
  border-radius: var(--border-radius);
  background: var(--bg1);
  border: 1px dashed rgba(255,255,255,0.1);
}

/* Category colors (bg with opacity) */
.cat-alkali     { background: color-mix(in srgb, var(--cat-alkali) 38%, var(--bg_s)); }
.cat-alkaline   { background: color-mix(in srgb, var(--cat-alkaline) 38%, var(--bg_s)); }
.cat-transition { background: color-mix(in srgb, var(--cat-transition) 35%, var(--bg_s)); }
.cat-post-trans { background: color-mix(in srgb, var(--cat-post-trans) 32%, var(--bg_s)); }
.cat-metalloid  { background: color-mix(in srgb, var(--cat-metalloid) 32%, var(--bg_s)); }
.cat-nonmetal   { background: color-mix(in srgb, var(--cat-nonmetal) 35%, var(--bg_s)); }
.cat-halogen    { background: color-mix(in srgb, var(--cat-halogen) 35%, var(--bg_s)); }
.cat-noble      { background: color-mix(in srgb, var(--cat-noble) 45%, var(--bg_s)); }
.cat-lanthanide { background: color-mix(in srgb, var(--cat-lanthanide) 35%, var(--bg_s)); }
.cat-actinide   { background: color-mix(in srgb, var(--cat-actinide) 35%, var(--bg_s)); }
.cat-unknown    { background: color-mix(in srgb, var(--cat-unknown) 55%, var(--bg_s)); }

/* Legend */
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem 1rem;
  justify-content: center;
  margin-top: 1.5rem;
  /* max-width: calc(18 * var(--cell-size) + 17 * var(--gap)); */
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 0.4em;
  font-size: clamp(0.55rem, 0.75vw, 0.68rem);
  color: var(--fg3);
}
.legend-dot {
  width: 0.7em;
  height: 0.7em;
  border-radius: 2px;
  flex-shrink: 0;
}

/* Tooltip */
.tooltip {
  display: none;
  position: fixed;
  z-index: 100;
  background: var(--bg1);
  border: 1px solid var(--bg3);
  border-radius: 6px;
  padding: 0.6rem 0.9rem;
  pointer-events: none;
  box-shadow: 0 8px 32px rgba(0,0,0,0.7);
  min-width: 140px;
  font-size: 0.72rem;
  color: var(--fg2);
  line-height: 1.6;
}
.tooltip.active { display: block; }
.tooltip-symbol {
  font-size: 1.4rem;
  font-weight: 700;
  color: var(--fg);
  line-height: 1;
  margin-bottom: 0.2rem;
}
.tooltip-row { display: flex; justify-content: space-between; gap: 1em; }
.tooltip-key { color: var(--fg4); }
</style>
</head>

// ── Build grid ──
const grid = document.getElementById('pt-grid');

function makeCell(el) {
  const [num, sym, name, pinyin, mass, cat, period, group] = el;
  const div = document.createElement('div');
  div.className = `el ${CAT_INFO[cat].cls}`;
  div.dataset.num = num;

  div.innerHTML = `
    <div class="el-top">
      <span class="el-num">${num}</span>
      <span class="el-symbol">${sym}</span>
    </div>
    <div class="el-name">${name}</div>
    <div class="el-bottom">
      <span class="el-pinyin">${pinyin}</span>
      <span class="el-mass">${mass}</span>
    </div>
  `;
  return div;
}

function makeEmpty() {
  const d = document.createElement('div');
  d.className = 'el-empty';
  return d;
}

function makeSeriesLabel(text) {
  const d = document.createElement('div');
  d.className = 'series-label';
  d.innerHTML = text;
  return d;
}

// Periods 1–7 in the main grid
for (let period = 1; period <= 7; period++) {
  for (let group = 1; group <= 18; group++) {
    // Spacer placeholders for lanthanide/actinide references
    if ((period === 6 || period === 7) && group >= 4 && group <= 17 &&
        !map[period]?.[group]) {
      grid.appendChild(makeEmpty());
      continue;
    }
    // La placeholder
    if (period === 6 && group === 3) {
      const el = map[6][3]; // La
      if (el) {
        grid.appendChild(makeCell(el));
      } else { grid.appendChild(makeEmpty()); }
      continue;
    }
    // Ac placeholder
    if (period === 7 && group === 3) {
      const el = map[7][3]; // Ac
      if (el) grid.appendChild(makeCell(el));
      else grid.appendChild(makeEmpty());
      continue;
    }

    const el = map[period]?.[group];
    if (el) {
      grid.appendChild(makeCell(el));
    } else {
      grid.appendChild(makeEmpty());
    }
  }
}

// Gap row
const gapRow = document.createElement('div');
gapRow.className = 'gap-row';
gapRow.style.gridColumn = '1 / -1';
grid.appendChild(gapRow);

// Lanthanide row (period 8): col 1 = label, col 2 = empty, col 3 = Ce(58)..Lu(71)
for (let group = 1; group <= 18; group++) {
  if (group === 1) {
    grid.appendChild(makeSeriesLabel('镧系<br>57–71'));
    continue;
  }
  if (group === 2) {
    grid.appendChild(makeEmpty());
    continue;
  }
  if (group === 3) {
    // Ce starts at col 4 in display but we start from col3
    grid.appendChild(makeEmpty());
    continue;
  }
  // groups 4..17 → elements 58..71
  const el = map[8]?.[group];
  if (el) grid.appendChild(makeCell(el));
  else grid.appendChild(makeEmpty());
}

// Actinide row (period 9)
for (let group = 1; group <= 18; group++) {
  if (group === 1) {
    grid.appendChild(makeSeriesLabel('锕系<br>89–103'));
    continue;
  }
  if (group === 2) {
    grid.appendChild(makeEmpty());
    continue;
  }
  if (group === 3) {
    grid.appendChild(makeEmpty());
    continue;
  }
  const el = map[9]?.[group];
  if (el) grid.appendChild(makeCell(el));
  else grid.appendChild(makeEmpty());
}

// ── Legend ──
const legendEl = document.getElementById('legend');
for (const [code, info] of Object.entries(CAT_INFO)) {
  const item = document.createElement('div');
  item.className = 'legend-item';
  item.innerHTML = `<div class="legend-dot" style="background:${info.color}55;border:1px solid ${info.color}"></div>${info.label}`;
  legendEl.appendChild(item);
}

// ── Tooltip ──
const tooltip = document.getElementById('tooltip');
const catNames = {
  AK:'碱金属', AE:'碱土金属', TM:'过渡金属', PT:'后过渡金属',
  ML:'类金属', NM:'非金属', HA:'卤素', NG:'稀有气体',
  LN:'镧系', AC:'锕系', UK:'性质未知'
};

document.querySelectorAll('.el').forEach(cell => {
  const num = parseInt(cell.dataset.num);
  const el = ELEMENTS.find(e => e[0] === num);
  if (!el) return;
  const [n, sym, name, pinyin, mass, cat] = el;

  cell.addEventListener('mouseenter', (e) => {
    tooltip.innerHTML = `
      <div class="tooltip-symbol">${sym}</div>
      <div class="tooltip-row"><span class="tooltip-key">序数</span><span>${n}</span></div>
      <div class="tooltip-row"><span class="tooltip-key">中文名</span><span>${name}（${pinyin}）</span></div>
      <div class="tooltip-row"><span class="tooltip-key">原子质量</span><span>${mass}</span></div>
      <div class="tooltip-row"><span class="tooltip-key">分类</span><span>${catNames[cat]}</span></div>
    `;
    tooltip.classList.add('active');
  });

  cell.addEventListener('mousemove', (e) => {
    const pad = 14;
    let x = e.clientX + pad, y = e.clientY + pad;
    const tw = tooltip.offsetWidth, th = tooltip.offsetHeight;
    if (x + tw > window.innerWidth) x = e.clientX - tw - pad;
    if (y + th > window.innerHeight) y = e.clientY - th - pad;
    tooltip.style.left = x + 'px';
    tooltip.style.top = y + 'px';
  });

  cell.addEventListener('mouseleave', () => {
    tooltip.classList.remove('active');
  });
});
</script>
</body>
</html>
