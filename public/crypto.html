<!DOCTYPE html>
<html lang="zh-hans" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#282828" id="theme-color-meta">
    <title>前端加解密工具</title>
    <meta name="description" content="基于Web Crypto API的前端加解密工具，兼容OpenSSL格式">
    <script>
        (function () {
            const saved = localStorage.getItem('theme-preference');
            const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            let resolvedTheme;
            let preference;

            if (saved === 'dark' || saved === 'light' || saved === 'auto') {
                preference = saved;
            } else {
                preference = 'auto';
            }

            if (preference === 'auto') {
                resolvedTheme = systemDark ? 'dark' : 'light';
            } else {
                resolvedTheme = preference;
            }

            document.documentElement.setAttribute('data-theme', resolvedTheme);
            document.documentElement.setAttribute('data-theme-preference', preference);

            const meta = document.getElementById('theme-color-meta');
            if (meta) {
                meta.setAttribute('content', resolvedTheme === 'dark' ? '#282828' : '#fbf1c7');
            }
        })();
    </script>
    <style>
        :root {
            --font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                "Helvetica Neue",
                Arial,
                "Noto Sans",
                "Liberation Sans",
                sans-serif,
                "Apple Color Emoji",
                "Segoe UI Emoji",
                "Segoe UI Symbol",
                "Noto Color Emoji",
                "Source Han Sans VF",
                "Microsoft YaHei",
                "PingFang SC",
                "Hiragino Sans GB",
                "WenQuanYi Micro Hei",
                sans-serif;

            --font-family-monospace:
                SFMono-Regular,
                Menlo,
                Monaco,
                Consolas,
                "Liberation Mono",
                "Courier New",
                "JetBrains Mono",
                "Source Han Sans VF",
                "Microsoft YaHei",
                "PingFang SC",
                "Hiragino Sans GB",
                monospace;

            --transition-time: 0.2s;
            --transition-time-slow: 0.3s;
            --radius-sm: 2px;
            --radius: 4px;
            --breakpoint-sm: 576px;
            --breakpoint-md: 768px;
            --breakpoint-lg: 992px;
            --breakpoint-xl: 1200px;
            font-size: 16px;
        }

        [data-theme="dark"] {
            color-scheme: dark;
            --bg_h: #1d2021;
            --bg: #282828;
            --bg_s: #32302f;
            --bg1: #3c3836;
            --bg2: #504945;
            --bg3: #665c54;
            --bg4: #7c6f64;
            --fg: #fbf1c7;
            --fg1: #ebdbb2;
            --fg2: #d5c4a1;
            --fg3: #bdae93;
            --fg4: #a89984;
            --red: #fb4934;
            --green: #b8bb26;
            --yellow: #fabd2f;
            --blue: #83a598;
            --purple: #d3869b;
            --aqua: #8ec07c;
            --gray: #928374;
            --orange: #fe8019;
            --red-dim: #cc2412;
            --green-dim: #98971a;
            --yellow-dim: #d79921;
            --blue-dim: #458588;
            --purple-dim: #b16286;
            --aqua-dim: #689d6a;
            --gray-dim: #a89984;
            --orange-dim: #d65d0e;
        }

        [data-theme="light"] {
            color-scheme: light;
            --bg_h: #f9f5d7;
            --bg: #fbf1c7;
            --bg_s: #f2e5bc;
            --bg1: #ebdbb2;
            --bg2: #d5c4a1;
            --bg3: #bdae93;
            --bg4: #a89984;
            --fg: #282828;
            --fg1: #3c3836;
            --fg2: #504945;
            --fg3: #665c54;
            --fg4: #7c6f64;
            --red: #9d0006;
            --green: #79740e;
            --yellow: #b57614;
            --blue: #076678;
            --purple: #8f3f71;
            --aqua: #427b58;
            --orange: #af3a03;
            --gray: #928374;
            --red-dim: #cc2412;
            --green-dim: #98971a;
            --yellow-dim: #d79921;
            --blue-dim: #458598;
            --purple-dim: #b16286;
            --aqua-dim: #689d6a;
            --orange-dim: #d65d0e;
            --gray-dim: #7c6f64;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg);
            color: var(--fg1);
            line-height: 1.5;
            min-height: 100vh;
            padding: 1.25rem;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 780px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .app-title {
            color: var(--yellow);
            font-size: 1.5rem;
            font-weight: 700;
            line-height: 1.3;
            margin: 0;
        }

        .app-description {
            color: var(--fg3);
            font-size: 0.875rem;
            line-height: 1.5;
        }

        .section {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .label-bar {
            display: flex;
            align-items: baseline;
            gap: 0.5rem;
            flex-wrap: wrap;
            min-height: 1.75rem;
        }

        .label-text {
            color: var(--green-dim);
            font-size: 0.875rem;
            font-weight: 600;
            flex-shrink: 0;
            line-height: 1.75rem;
        }

        .label-stats {
            color: var(--fg4);
            font-size: 0.8rem;
            flex-shrink: 0;
            line-height: 1.75rem;
        }

        .btn-text {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            color: var(--fg2);
            font-family: var(--font-family);
            font-size: 0.875rem;
            cursor: pointer;
            padding: 0.25rem 0.5rem;
            line-height: 1.5;
            transition: color var(--transition-time) ease;
            text-decoration: none;
            white-space: nowrap;
            flex-shrink: 0;
            border-radius: var(--radius-sm);
            min-height: 1.75rem;
        }

        .btn-text:hover {
            color: var(--fg);
        }

        .btn-text:active {
            color: var(--fg1);
        }

        .btn-text.btn-flex {
            flex-grow: 1;
            justify-content: flex-start;
            text-align: left;
            min-width: 0;
        }

        .btn-outline {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: none;
            border: 1px solid var(--green);
            color: var(--green);
            font-family: var(--font-family);
            font-size: 0.875rem;
            cursor: pointer;
            padding: 0.35rem 1rem;
            line-height: 1.5;
            border-radius: var(--radius-sm);
            transition: background-color var(--transition-time) ease;
            text-decoration: none;
            white-space: nowrap;
            flex-shrink: 0;
            min-height: 2rem;
        }

        .btn-outline:hover {
            background-color: var(--bg_s);
        }

        .btn-outline:active {
            background-color: var(--bg1);
        }

        .textarea,
        .card-placeholder {
            width: 100%;
            height: 180px;
            font-family: var(--font-family-monospace);
            font-size: 0.875rem;
            line-height: 1.5;
            padding: 0.6rem 0.75rem;
            border: 1px solid var(--bg3);
            border-radius: var(--radius-sm);
            background-color: var(--bg_h);
            color: var(--fg);
            resize: none;
            outline: none;
            transition: border-color var(--transition-time) ease;
            display: block;
        }

        .textarea:focus {
            border-color: var(--green);
        }

        .textarea[readonly] {
            cursor: default;
            background-color: var(--bg_s);
        }

        .card-placeholder {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            cursor: default;
        }

        .card-placeholder.hidden,
        .textarea.hidden {
            display: none;
        }

        .file-card {
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
            width: 100%;
        }

        .file-card-name {
            flex: 1 1 auto;
            overflow: hidden;
            word-break: break-all;
            overflow-wrap: break-word;
            white-space: normal;
            color: var(--fg1);
            font-size: 0.875rem;
            line-height: 1.4;
            min-height: 0;
            padding-bottom: 0.4rem;
        }

        .file-card-meta {
            flex-shrink: 0;
            color: var(--fg4);
            font-size: 0.8rem;
            line-height: 1.3;
            padding-top: 0.4rem;
            border-top: 1px solid var(--bg2);
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper.drag-over .textarea,
        .input-wrapper.drag-over .card-placeholder {
            border-color: var(--green);
        }

        .password-input {
            width: 100%;
            font-family: var(--font-family-monospace);
            font-size: 0.875rem;
            padding: 0.5rem 0.75rem;
            border: 1px solid var(--bg3);
            border-radius: var(--radius-sm);
            background-color: var(--bg_h);
            color: var(--fg);
            outline: none;
            transition: border-color var(--transition-time) ease;
            line-height: 1.5;
        }

        .password-input:focus {
            border-color: var(--green);
        }

        .action-bar {
            display: flex;
            align-items: flex-end;
            gap: 0.6rem;
            flex-wrap: wrap;
            min-height: 2.25rem;
        }

        .checkbox-label {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            color: var(--fg2);
            font-size: 0.85rem;
            cursor: pointer;
            flex-shrink: 0;
            line-height: 1.75rem;
            user-select: none;
        }

        .checkbox-label input[type="checkbox"] {
            accent-color: var(--green);
            width: 1rem;
            height: 1rem;
            cursor: pointer;
            flex-shrink: 0;
        }

        .iter-input {
            border: none;
            border-bottom: 1px solid var(--bg3);
            background: none;
            color: var(--fg);
            font-family: var(--font-family-monospace);
            font-size: 0.8rem;
            padding: 0.2rem 0.25rem;
            min-width: 5.5rem;
            outline: none;
            transition: border-color var(--transition-time) ease;
            line-height: 1.5;
            text-align: left;
            flex-shrink: 0;
        }

        .iter-input:focus {
            border-bottom-color: var(--green);
        }

        .iter-label {
            color: var(--fg2);
            font-size: 0.85rem;
            flex-shrink: 0;
            line-height: 1.75rem;
            margin-left: 0.75rem;
        }

        .status-bar {
            font-size: 0.8rem;
            line-height: 1.4;
            min-height: 1.25rem;
            color: var(--fg4);
            transition: color var(--transition-time) ease;
            word-break: break-all;
        }

        .status-bar.status-success {
            color: var(--green);
        }

        .status-bar.status-error {
            color: var(--orange);
        }

        .warning-card {
            display: flex;
            flex-direction: column;
            height: 180px;
            width: 100%;
            border: 1px solid var(--orange);
            border-radius: var(--radius-sm);
            background-color: var(--bg_h);
            padding: 0.75rem 0.85rem;
            gap: 0.6rem;
            overflow: hidden;
        }

        .warning-card.hidden {
            display: none;
        }

        .warning-text {
            color: var(--orange);
            font-size: 0.85rem;
            line-height: 1.5;
            flex: 1 1 auto;
            min-height: 0;
            overflow: auto;
        }

        .warning-actions {
            flex-shrink: 0;
            display: flex;
            gap: 0.5rem;
        }

        .hint-bar {
            font-size: 0.78rem;
            color: var(--fg4);
            line-height: 1.5;
            word-break: break-all;
            font-family: var(--font-family-monospace);
            background-color: var(--bg_h);
            padding: 0.5rem 0.7rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--bg3);
            overflow-x: auto;
            white-space: pre-wrap;
        }

        @media (max-width: 576px) {
            body {
                padding: 0.75rem;
            }
            .app-container {
                gap: 0.75rem;
            }
            .app-title {
                font-size: 1.25rem;
            }
            .textarea,
            .card-placeholder,
            .warning-card {
                height: 150px;
            }
            .action-bar {
                gap: 0.4rem;
            }
            .btn-outline {
                padding: 0.35rem 0.75rem;
                font-size: 0.8rem;
            }
            .btn-text {
                font-size: 0.8rem;
                padding: 0.2rem 0.4rem;
            }
            .iter-input {
                width: 4.5rem;
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <h1 class="app-title">前端加解密工具</h1>
        <p class="app-description">
            基于 Web Crypto API 的 AES-256-CBC 加解密，密钥派生使用 PBKDF2。
            所有运算均在浏览器本地完成，数据不会上传到任何服务器。密文兼容 OpenSSL 格式（<code>Salted__</code> 头 + salt + 密文）。
        </p>

        <div class="section" id="input-section">
            <div class="label-bar">
                <span class="label-text">输入</span>
                <button class="btn-text btn-flex" id="file-upload-btn" type="button" title="点击上传文件（也可拖拽到输入区域）">上传文件</button>
                <span class="label-stats" id="input-char-count">0 字符</span>
                <button class="btn-text" id="clear-input-btn" type="button">清空</button>
            </div>
            <div class="input-wrapper" id="input-wrapper">
                <textarea class="textarea" id="input-textarea" placeholder="在此输入文本，或拖拽文件到此处..."></textarea>
                <div class="card-placeholder hidden" id="file-card-placeholder">
                    <div class="file-card">
                        <div class="file-card-name" id="file-card-name"></div>
                        <div class="file-card-meta" id="file-card-meta"></div>
                    </div>
                </div>
            </div>
            <input type="file" id="hidden-file-input" style="display:none;" aria-hidden="true">
        </div>

        <div class="section">
            <label class="label-text" for="password-input" style="display:block;margin-bottom:0.1rem;">密码</label>
            <input type="password" class="password-input" id="password-input" placeholder="输入密码...">
        </div>

        <div class="action-bar">
            <label class="checkbox-label">
                <input type="checkbox" id="decrypt-checkbox">
                <span>解密</span>
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="base64-checkbox" checked>
                <span>Base64</span>
            </label>
            <span class="iter-label">迭代</span>
            <input type="number" class="iter-input" id="iter-input" value="10000" min="1" max="99999999" step="1">
            <span style="flex-grow:1;min-width:0.5rem;"></span>
            <button class="btn-outline" id="action-btn" type="button">加密</button>
        </div>

        <div class="status-bar" id="status-bar"></div>

        <div class="section" id="output-section">
            <div class="label-bar">
                <span class="label-text">输出</span>
                <button class="btn-text btn-flex" id="download-btn" type="button">下载文件</button>
                <span class="label-stats" id="output-char-count">0 字符</span>
                <button class="btn-text" id="copy-btn" type="button">复制</button>
            </div>
            <div style="position:relative;">
                <textarea class="textarea" id="output-textarea" readonly placeholder="输出结果将显示在这里..."></textarea>
                <div class="warning-card hidden" id="output-warning">
                    <div class="warning-text" id="warning-text"></div>
                    <div class="warning-actions">
                        <button class="btn-outline" id="load-output-btn" type="button">加载</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="hint-bar" id="hint-bar"></div>
    </div>

    <script>
        (function () {
            const inputTextarea = document.getElementById('input-textarea');
            const fileCardPlaceholder = document.getElementById('file-card-placeholder');
            const fileCardName = document.getElementById('file-card-name');
            const fileCardMeta = document.getElementById('file-card-meta');
            const inputCharCount = document.getElementById('input-char-count');
            const inputWrapper = document.getElementById('input-wrapper');
            const hiddenFileInput = document.getElementById('hidden-file-input');
            const fileUploadBtn = document.getElementById('file-upload-btn');
            const clearInputBtn = document.getElementById('clear-input-btn');
            const passwordInput = document.getElementById('password-input');
            const decryptCheckbox = document.getElementById('decrypt-checkbox');
            const base64Checkbox = document.getElementById('base64-checkbox');
            const iterInput = document.getElementById('iter-input');
            const actionBtn = document.getElementById('action-btn');
            const statusBar = document.getElementById('status-bar');
            const outputTextarea = document.getElementById('output-textarea');
            const outputWarning = document.getElementById('output-warning');
            const warningText = document.getElementById('warning-text');
            const loadOutputBtn = document.getElementById('load-output-btn');
            const outputCharCount = document.getElementById('output-char-count');
            const downloadBtn = document.getElementById('download-btn');
            const copyBtn = document.getElementById('copy-btn');
            const hintBar = document.getElementById('hint-bar');

            let currentFile = null;
            let currentFileData = null;
            let lastOperationOutput = null;
            let lastOutputIsBinary = false;
            let lastOutputMimeType = 'text/plain';
            let outputIsHiddenByWarning = false;
            let pendingOutputText = null;

            function formatFileSize(bytes) {
                if (bytes === 0) return '0 B';
                const units = ['B', 'KB', 'MB', 'GB', 'TB'];
                const k = 1024;
                const i = Math.min(Math.floor(Math.log(bytes) / Math.log(k)), units.length - 1);
                const size = bytes / Math.pow(k, i);
                if (i === 0) return size + ' ' + units[i];
                return size.toFixed(1) + ' ' + units[i];
            }

            function isFileMode() {
                return currentFile !== null;
            }

            function updateInputUI() {
                if (isFileMode()) {
                    inputTextarea.classList.add('hidden');
                    fileCardPlaceholder.classList.remove('hidden');
                    fileCardName.textContent = currentFile.name;
                    fileCardMeta.textContent = '大小: ' + formatFileSize(currentFile.size);
                    inputCharCount.textContent = '';
                } else {
                    inputTextarea.classList.remove('hidden');
                    fileCardPlaceholder.classList.add('hidden');
                    const len = inputTextarea.value.length;
                    inputCharCount.textContent = len + ' 字符';
                }
            }

            function setStatus(message, type) {
                statusBar.textContent = message;
                statusBar.className = 'status-bar';
                if (type === 'success') {
                    statusBar.classList.add('status-success');
                } else if (type === 'error') {
                    statusBar.classList.add('status-error');
                }
            }

            function clearStatus() {
                statusBar.textContent = '';
                statusBar.className = 'status-bar';
            }

            function hideOutputWarning() {
                outputWarning.classList.add('hidden');
                outputTextarea.classList.remove('hidden');
                outputIsHiddenByWarning = false;
                pendingOutputText = null;
            }

            function showOutputWarning(message) {
                warningText.textContent = message;
                outputWarning.classList.remove('hidden');
                outputTextarea.classList.add('hidden');
                outputIsHiddenByWarning = true;
                pendingOutputText = lastOperationOutput;
            }

            function setOutput(text, isBinary, mimeType) {
                lastOperationOutput = text;
                lastOutputIsBinary = !!isBinary;
                lastOutputMimeType = mimeType || 'text/plain';
                pendingOutputText = text;

                const isDecryptMode = decryptCheckbox.checked;
                const useBase64 = base64Checkbox.checked;

                let shouldWarn = false;
                if (!isDecryptMode) {
                    if (!useBase64) {
                        shouldWarn = true;
                    } else if (text && text.length > 1024 * 1024) {
                        shouldWarn = true;
                    }
                }

                if (shouldWarn) {
                    let warnMsg = '';
                    if (!isDecryptMode && !useBase64) {
                        warnMsg = '当前为加密模式且未启用 Base64 编码。输出包含原始二进制数据，在文本框中显示可能导致乱码或数据损坏。建议启用 Base64 编码后再操作，或直接下载文件。';
                    } else if (!isDecryptMode && text && text.length > 1024 * 1024) {
                        warnMsg = '输出内容超过 1MB，在文本框中加载可能导致页面卡顿。建议直接下载文件，或点击"加载"按钮确认显示。';
                    }
                    showOutputWarning(warnMsg);
                } else {
                    outputTextarea.value = text || '';
                    outputCharCount.textContent = (text || '').length + ' 字符';
                    hideOutputWarning();
                }
            }

            function clearOutput() {
                outputTextarea.value = '';
                outputCharCount.textContent = '0 字符';
                lastOperationOutput = null;
                lastOutputIsBinary = false;
                lastOutputMimeType = 'text/plain';
                outputIsHiddenByWarning = false;
                pendingOutputText = null;
                hideOutputWarning();
            }

            function clearInput() {
                currentFile = null;
                currentFileData = null;
                inputTextarea.value = '';
                hiddenFileInput.value = '';
                passwordInput.value = '';
                updateInputUI();
                clearOutput();
                clearStatus();
            }

            function arrayBufferToBase64(buffer) {
                const bytes = new Uint8Array(buffer);
                let binary = '';
                for (let i = 0; i < bytes.length; i++) {
                    binary += String.fromCharCode(bytes[i]);
                }
                return btoa(binary);
            }

            function base64ToArrayBuffer(base64) {
                const cleaned = base64.replace(/[\r\n\s]/g, '');
                const binary = atob(cleaned);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) {
                    bytes[i] = binary.charCodeAt(i);
                }
                return bytes.buffer;
            }

            function textToArrayBuffer(text) {
                const encoder = new TextEncoder();
                return encoder.encode(text).buffer;
            }

            function arrayBufferToText(buffer) {
                const decoder = new TextDecoder('utf-8', { fatal: false });
                return decoder.decode(new Uint8Array(buffer));
            }

            function generateRandomSalt() {
                const salt = new Uint8Array(8);
                crypto.getRandomValues(salt);
                return salt;
            }

            async function deriveKeyAndIV(password, salt, iterations) {
                const passwordKey = await crypto.subtle.importKey(
                    'raw',
                    typeof password === 'string' ? new TextEncoder().encode(password) : password,
                    'PBKDF2',
                    false,
                    ['deriveBits']
                );

                const derivedBits = await crypto.subtle.deriveBits({
                    name: 'PBKDF2',
                    salt: salt,
                    iterations: iterations,
                    hash: 'SHA-256'
                }, passwordKey, 384);

                const derived = new Uint8Array(derivedBits);
                const keyBytes = derived.slice(0, 32);
                const iv = derived.slice(32, 48);
                return { keyBytes, iv };
            }

            async function encryptData(plainData, password, iterations) {
                const salt = generateRandomSalt();
                const { keyBytes, iv } = await deriveKeyAndIV(password, salt, iterations);

                const aesKey = await crypto.subtle.importKey(
                    'raw',
                    keyBytes,
                    'AES-CBC',
                    false,
                    ['encrypt']
                );

                const ciphertext = await crypto.subtle.encrypt(
                    { name: 'AES-CBC', iv: iv },
                    aesKey,
                    plainData
                );

                const header = new TextEncoder().encode('Salted__');
                const result = new Uint8Array(header.length + salt.length + ciphertext.byteLength);
                result.set(header, 0);
                result.set(salt, header.length);
                result.set(new Uint8Array(ciphertext), header.length + salt.length);
                return result.buffer;
            }

            async function decryptData(encryptedData, password, iterations) {
                const data = new Uint8Array(encryptedData);
                const headerStr = 'Salted__';
                const headerBytes = new TextEncoder().encode(headerStr);

                if (data.length < headerBytes.length + 8) {
                    throw new Error('数据太短，不是有效的 OpenSSL 格式（需要 Salted__ 头 + 8 字节 salt）');
                }

                let headerMatch = true;
                for (let i = 0; i < headerBytes.length; i++) {
                    if (data[i] !== headerBytes[i]) {
                        headerMatch = false;
                        break;
                    }
                }

                if (!headerMatch) {
                    throw new Error('未找到 Salted__ 头，数据不是有效的 OpenSSL 格式');
                }

                const salt = data.slice(headerBytes.length, headerBytes.length + 8);
                const ciphertext = data.slice(headerBytes.length + 8);

                if (ciphertext.length === 0) {
                    throw new Error('密文数据为空');
                }

                const { keyBytes, iv } = await deriveKeyAndIV(password, salt, iterations);

                const aesKey = await crypto.subtle.importKey(
                    'raw',
                    keyBytes,
                    'AES-CBC',
                    false,
                    ['decrypt']
                );

                const plaintext = await crypto.subtle.decrypt(
                    { name: 'AES-CBC', iv: iv },
                    aesKey,
                    ciphertext
                );

                return plaintext;
            }

            async function performAction() {
                clearStatus();
                const password = passwordInput.value;
                if (!password) {
                    setStatus('请输入密码', 'error');
                    return;
                }

                const iterations = parseInt(iterInput.value, 10);
                if (isNaN(iterations) || iterations < 1 || iterations > 99999999) {
                    setStatus('迭代次数需在 1 到 99999999 之间', 'error');
                    return;
                }

                const isDecryptMode = decryptCheckbox.checked;
                const useBase64 = base64Checkbox.checked;

                let inputData;
                try {
                    if (isFileMode()) {
                        if (!currentFileData) {
                            const arrayBuf = await currentFile.arrayBuffer();
                            currentFileData = new Uint8Array(arrayBuf);
                        }
                        if (isDecryptMode && useBase64) {
                            const text = arrayBufferToText(currentFileData.buffer);
                            inputData = base64ToArrayBuffer(text);
                        } else {
                            inputData = currentFileData.buffer.slice(0);
                        }
                    } else {
                        const text = inputTextarea.value;
                        if (!text) {
                            setStatus('请输入文本或上传文件', 'error');
                            return;
                        }
                        if (isDecryptMode && useBase64) {
                            inputData = base64ToArrayBuffer(text);
                        } else if (isDecryptMode && !useBase64) {
                            setStatus('解密模式下，如果不启用 Base64，请上传二进制文件作为输入', 'error');
                            return;
                        } else {
                            inputData = textToArrayBuffer(text);
                        }
                    }
                } catch (e) {
                    setStatus('输入数据处理失败: ' + e.message, 'error');
                    return;
                }

                try {
                    if (isDecryptMode) {
                        const plainBuf = await decryptData(inputData, password, iterations);
                        const plainText = arrayBufferToText(plainBuf);
                        setOutput(plainText, false, 'text/plain');
                        setStatus('解密成功', 'success');
                    } else {
                        const encryptedBuf = await encryptData(inputData, password, iterations);
                        if (useBase64) {
                            const b64 = arrayBufferToBase64(encryptedBuf);
                            setOutput(b64, false, 'text/plain');
                        } else {
                            const binaryStr = arrayBufferToText(encryptedBuf);
                            setOutput(binaryStr, true, 'application/octet-stream');
                        }
                        setStatus('加密成功', 'success');
                    }
                } catch (e) {
                    setStatus('操作失败: ' + e.message, 'error');
                    clearOutput();
                }
            }

            function updateHint() {
                const isDecryptMode = decryptCheckbox.checked;
                const useBase64 = base64Checkbox.checked;
                const iterations = parseInt(iterInput.value, 10) || 10000;
                const iterArg = iterations === 10000 ? '' : ' -iter ' + iterations;

                let cmd;
                if (isDecryptMode) {
                    const inFile = useBase64 ? 'plaintext.txt' : 'plaintext.bin';
                    const outFile = useBase64 ? 'encrypted.txt' : 'encrypted.bin';
                    const base64Arg = useBase64 ? ' -base64' : '';
                    cmd = 'openssl enc -aes-256-cbc -pbkdf2' + iterArg + base64Arg + ' -in ' + inFile + ' -out ' + outFile;
                } else {
                    const inFile = useBase64 ? 'encrypted.txt' : 'encrypted.bin';
                    const outFile = 'decrypted.bin';
                    const base64Arg = useBase64 ? ' -base64' : '';
                    cmd = 'openssl enc -d -aes-256-cbc -pbkdf2' + iterArg + base64Arg + ' -in ' + inFile + ' -out ' + outFile;
                }
                hintBar.textContent = cmd;
            }

            function loadFileFromInput(file) {
                if (!file) return;
                currentFile = file;
                currentFileData = null;
                inputTextarea.value = '';
                updateInputUI();
                clearOutput();
                clearStatus();
            }

            inputTextarea.addEventListener('input', function () {
                if (!isFileMode()) {
                    const len = inputTextarea.value.length;
                    inputCharCount.textContent = len + ' 字符';
                }
                clearOutput();
                clearStatus();
            });

            fileUploadBtn.addEventListener('click', function (e) {
                e.preventDefault();
                hiddenFileInput.click();
            });

            hiddenFileInput.addEventListener('change', function () {
                if (hiddenFileInput.files && hiddenFileInput.files.length > 0) {
                    loadFileFromInput(hiddenFileInput.files[0]);
                }
            });

            clearInputBtn.addEventListener('click', function () {
                clearInput();
            });

            inputWrapper.addEventListener('dragover', function (e) {
                e.preventDefault();
                e.stopPropagation();
                inputWrapper.classList.add('drag-over');
            });

            inputWrapper.addEventListener('dragleave', function (e) {
                e.preventDefault();
                e.stopPropagation();
                if (!inputWrapper.contains(e.relatedTarget)) {
                    inputWrapper.classList.remove('drag-over');
                }
            });

            inputWrapper.addEventListener('drop', function (e) {
                e.preventDefault();
                e.stopPropagation();
                inputWrapper.classList.remove('drag-over');
                if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                    loadFileFromInput(e.dataTransfer.files[0]);
                }
            });

            document.addEventListener('dragover', function (e) {
                if (inputWrapper.contains(e.target)) {
                    return;
                }
                e.preventDefault();
            });

            document.addEventListener('drop', function (e) {
                if (inputWrapper.contains(e.target)) {
                    return;
                }
                e.preventDefault();
            });

            decryptCheckbox.addEventListener('change', function () {
                actionBtn.textContent = decryptCheckbox.checked ? '解密' : '加密';
                clearOutput();
                clearStatus();
                updateHint();
            });

            base64Checkbox.addEventListener('change', function () {
                clearOutput();
                clearStatus();
                updateHint();
            });

            iterInput.addEventListener('input', function () {
                updateHint();
            });

            iterInput.addEventListener('change', function () {
                let val = parseInt(iterInput.value, 10);
                if (isNaN(val) || val < 1) {
                    val = 10000;
                }
                if (val > 99999999) {
                    val = 99999999;
                }
                iterInput.value = val;
                updateHint();
            });

            passwordInput.addEventListener('input', function () {
                clearOutput();
                clearStatus();
            });

            actionBtn.addEventListener('click', function () {
                performAction();
            });

            loadOutputBtn.addEventListener('click', function () {
                if (pendingOutputText !== null) {
                    outputTextarea.value = pendingOutputText;
                    outputCharCount.textContent = pendingOutputText.length + ' 字符';
                }
                hideOutputWarning();
                setStatus('已加载输出内容', 'success');
            });

            downloadBtn.addEventListener('click', function () {
                if (lastOperationOutput === null && (!pendingOutputText && outputIsHiddenByWarning)) {
                    setStatus('没有可下载的输出内容', 'error');
                    return;
                }
                const content = outputIsHiddenByWarning ? pendingOutputText : lastOperationOutput;
                if (content === null || content === undefined) {
                    setStatus('没有可下载的输出内容', 'error');
                    return;
                }
                const isDecryptMode = decryptCheckbox.checked;
                const useBase64 = base64Checkbox.checked;
                let filename;
                let blob;

                if (isDecryptMode) {
                    filename = 'decrypted.bin';
                    blob = new Blob([new TextEncoder().encode(content)], { type: 'application/octet-stream' });
                } else {
                    if (useBase64) {
                        filename = 'encrypted.txt';
                        blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
                    } else {
                        filename = 'encrypted.bin';
                        const encoder = new TextEncoder();
                        const bytes = encoder.encode(content);
                        blob = new Blob([bytes], { type: 'application/octet-stream' });
                    }
                }

                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                setStatus('文件已下载: ' + filename, 'success');
            });

            copyBtn.addEventListener('click', async function () {
                const content = outputIsHiddenByWarning ? pendingOutputText : lastOperationOutput;
                if (content === null || content === undefined) {
                    setStatus('没有可复制的内容', 'error');
                    return;
                }
                try {
                    await navigator.clipboard.writeText(content);
                    setStatus('已复制到剪贴板 (' + content.length + ' 字符)', 'success');
                } catch (e) {
                    outputTextarea.select();
                    outputTextarea.setSelectionRange(0, content.length);
                    try {
                        document.execCommand('copy');
                        setStatus('已复制到剪贴板', 'success');
                    } catch (e2) {
                        setStatus('复制失败，请手动选择文本复制', 'error');
                    }
                }
            });

            updateInputUI();
            updateHint();
            actionBtn.textContent = '加密';
            outputCharCount.textContent = '0 字符';
        })();
    </script>
</body>
</html>
