<!DOCTYPE html>
<html lang="zh-hans">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#282828" id="theme-color-meta">
  <title>统一模板</title>
  <script>
    (function() {
      const STORAGE_KEY = 'theme-preference';
      const DARK_MEDIA = window.matchMedia('(prefers-color-scheme: dark)');

      function getSavedTheme() {
        try { return localStorage.getItem(STORAGE_KEY); } catch (e) { return null; }
      }
      function saveTheme(theme) {
        try {
          if (theme) localStorage.setItem(STORAGE_KEY, theme);
          else localStorage.removeItem(STORAGE_KEY);
        } catch (e) { console.warn('无法保存主题偏好:', e); }
      }
      function applyTheme(theme) {
        const root = document.documentElement;
        root.classList.remove('theme-dark', 'theme-light');
        root.classList.add(theme);
        const meta = document.getElementById('theme-color-meta');
        if (meta) meta.content = theme === 'theme-dark' ? '#282828' : '#fbf1c7';
      }
      function getSystemTheme() { return DARK_MEDIA.matches ? 'theme-dark' : 'theme-light'; }

      const saved = getSavedTheme();
      if (saved) applyTheme(saved);
      else applyTheme(getSystemTheme());

      DARK_MEDIA.addEventListener('change', function(e) {
        if (!getSavedTheme()) applyTheme(e.matches ? 'theme-dark' : 'theme-light');
      });

      window.ThemeManager = {
        set: function(theme) {
          if (theme !== 'theme-dark' && theme !== 'theme-light') return;
          saveTheme(theme); applyTheme(theme);
        },
        followSystem: function() { saveTheme(null); applyTheme(getSystemTheme()); },
        toggle: function() {
          const cur = document.documentElement.classList.contains('theme-dark') ? 'theme-dark' : 'theme-light';
          this.set(cur === 'theme-dark' ? 'theme-light' : 'theme-dark');
        },
        getCurrent: function() {
          const root = document.documentElement;
          if (root.classList.contains('theme-dark')) return 'theme-dark';
          if (root.classList.contains('theme-light')) return 'theme-light';
          return getSystemTheme();
        },
        isManual: function() { return !!getSavedTheme(); }
      };
    })();
  </script>
  <style>
    /* ========== 基础变量 ========== */
    :root {
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Liberation Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji", "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "WenQuanYi Micro Hei", sans-serif;
      --font-family-monospace: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", "JetBrains Mono", monospace;
      --radius-sm: 4px; --radius-md: 8px; --radius-lg: 12px; --radius-xl: 16px;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
      --transition-base: 0.2s ease;
      --transition-slow: 0.3s ease;
    }

    /* ========== Gruvbox Dark ========== */
    .theme-dark {
      color-scheme: dark;
      --bg_h: #1d2021; --bg: #282828; --bg_s: #32302f; --bg1: #3c3836; --bg2: #504945; --bg3: #665c54; --bg4: #7c6f64;
      --fg: #fbf1c7; --fg1: #ebdbb2; --fg2: #d5c4a1; --fg3: #bdae93; --fg4: #a89984;
      --red: #fb4934; --green: #b8bb26; --yellow: #fabd2f; --blue: #83a598; --purple: #d3869b; --aqua: #8ec07c; --gray: #928374; --orange: #fe8019;
      --red-dim: #cc2412; --green-dim: #98971a; --yellow-dim: #d79921; --blue-dim: #458588; --purple-dim: #b16286; --aqua-dim: #689d6a; --gray-dim: #a89984; --orange-dim: #d65d0e;
    }
    /* ========== Gruvbox Light ========== */
    .theme-light {
      color-scheme: light;
      --bg_h: #f9f5d7; --bg: #fbf1c7; --bg_s: #f2e5bc; --bg1: #ebdbb2; --bg2: #d5c4a1; --bg3: #bdae93; --bg4: #a89984;
      --fg: #282828; --fg1: #3c3836; --fg2: #504945; --fg3: #665c54; --fg4: #7c6f64;
      --red: #9d0006; --green: #79740e; --yellow: #b57614; --blue: #076678; --purple: #8f3f71; --aqua: #427b58; --gray: #928374; --orange: #af3a03;
      --red-dim: #cc2412; --green-dim: #98971a; --yellow-dim: #d79921; --blue-dim: #458598; --purple-dim: #b16286; --aqua-dim: #689d6a; --orange-dim: #d65d0e; --gray-dim: #7c6f64;
    }

    /* ========== 重置与基础 ========== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-family: var(--font-family); font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    body { background-color: var(--bg); color: var(--fg); min-height: 100vh; transition: background-color var(--transition-base), color var(--transition-base); }
    a { color: var(--blue); text-decoration: none; transition: color var(--transition-base); }
    a:hover { color: var(--blue-dim); text-decoration: underline; }
    img { max-width: 100%; height: auto; }
    input, button, textarea, select { font-family: inherit; font-size: inherit; }
    :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: var(--radius-sm); }

    /* ========== 布局工具类 ========== */
    .container { max-width: 960px; margin: 0 auto; padding: 2rem 1.5rem; }
    .flex { display: flex; } .grid { display: grid; }
    .flex-col { flex-direction: column; } .flex-wrap { flex-wrap: wrap; }
    .justify-start { justify-content: flex-start; } .justify-center { justify-content: center; } .justify-between { justify-content: space-between; } .justify-end { justify-content: flex-end; }
    .items-start { align-items: flex-start; } .items-center { align-items: center; } .items-end { align-items: flex-end; }
    .gap-1 { gap: 0.25rem; } .gap-2 { gap: 0.5rem; } .gap-3 { gap: 0.75rem; } .gap-4 { gap: 1rem; } .gap-6 { gap: 1.5rem; } .gap-8 { gap: 2rem; }
    .grid-cols-2 { grid-template-columns: repeat(2, 1fr); } .grid-cols-3 { grid-template-columns: repeat(3, 1fr); } .grid-cols-4 { grid-template-columns: repeat(4, 1fr); }
    .w-full { width: 100%; } .h-full { height: 100%; }

    /* ========== 间距工具类 ========== */
    .m-0 { margin: 0; } .m-1 { margin: 0.25rem; } .m-2 { margin: 0.5rem; } .m-4 { margin: 1rem; }
    .mt-1 { margin-top: 0.25rem; } .mt-2 { margin-top: 0.5rem; } .mt-3 { margin-top: 0.75rem; } .mt-4 { margin-top: 1rem; } .mt-6 { margin-top: 1.5rem; } .mt-8 { margin-top: 2rem; }
    .mb-1 { margin-bottom: 0.25rem; } .mb-2 { margin-bottom: 0.5rem; } .mb-3 { margin-bottom: 0.75rem; } .mb-4 { margin-bottom: 1rem; } .mb-6 { margin-bottom: 1.5rem; } .mb-8 { margin-bottom: 2rem; }
    .ml-1 { margin-left: 0.25rem; } .ml-2 { margin-left: 0.5rem; } .ml-auto { margin-left: auto; }
    .mr-1 { margin-right: 0.25rem; } .mr-2 { margin-right: 0.5rem; } .mr-auto { margin-right: auto; }
    .p-1 { padding: 0.25rem; } .p-2 { padding: 0.5rem; } .p-3 { padding: 0.75rem; } .p-4 { padding: 1rem; } .p-6 { padding: 1.5rem; }
    .px-2 { padding-left: 0.5rem; padding-right: 0.5rem; } .px-4 { padding-left: 1rem; padding-right: 1rem; }
    .py-1 { padding-top: 0.25rem; padding-bottom: 0.25rem; } .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; } .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }

    /* ========== 文字工具类 ========== */
    .text-xs { font-size: 0.75rem; } .text-sm { font-size: 0.875rem; } .text-base { font-size: 1rem; } .text-lg { font-size: 1.125rem; } .text-xl { font-size: 1.25rem; } .text-2xl { font-size: 1.5rem; } .text-3xl { font-size: 1.875rem; }
    .font-normal { font-weight: 400; } .font-medium { font-weight: 500; } .font-semibold { font-weight: 600; } .font-bold { font-weight: 700; }
    .text-left { text-align: left; } .text-center { text-align: center; } .text-right { text-align: right; }
    .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .text-fg { color: var(--fg); } .text-fg1 { color: var(--fg1); } .text-fg2 { color: var(--fg2); } .text-fg3 { color: var(--fg3); } .text-fg4 { color: var(--fg4); }
    .text-red { color: var(--red); } .text-green { color: var(--green); } .text-blue { color: var(--blue); } .text-yellow { color: var(--yellow); } .text-purple { color: var(--purple); } .text-orange { color: var(--orange); }

    /* ========== 主题切换控件 ========== */
    .theme-controls { position: fixed; top: 1rem; right: 1rem; display: flex; gap: 0.25rem; align-items: center; background: var(--bg_s); padding: 0.4rem; border-radius: var(--radius-lg); box-shadow: var(--shadow-md); border: 1px solid var(--bg2); z-index: 100; }
    .theme-btn { display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; border: none; border-radius: var(--radius-md); background: transparent; color: var(--fg3); cursor: pointer; font-size: 1rem; transition: all var(--transition-base); }
    .theme-btn:hover { background: var(--bg2); color: var(--fg); }
    .theme-btn.active { background: var(--bg3); color: var(--fg); }
    .theme-divider { width: 1px; height: 20px; background: var(--bg3); }

    /* ========== 卡片组件 ========== */
    .card { background: var(--bg_s); border: 1px solid var(--bg2); border-radius: var(--radius-lg); padding: 1.5rem; transition: background-color var(--transition-base), border-color var(--transition-base); }
    .card-hover:hover { border-color: var(--bg3); box-shadow: var(--shadow-md); }
    .card-title { font-size: 1.25rem; font-weight: 600; color: var(--fg1); margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }
    .card-body { color: var(--fg2); line-height: 1.7; }
    .card-body p { margin-bottom: 1rem; }
    .card-body p:last-child { margin-bottom: 0; }
    .card-footer { margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--bg2); display: flex; justify-content: flex-end; gap: 0.5rem; }

    /* ========== 按钮组件 ========== */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.55rem 1.1rem; border: none; border-radius: var(--radius-md); font-family: inherit; font-size: 0.95rem; font-weight: 500; cursor: pointer; transition: all var(--transition-base); white-space: nowrap; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: var(--blue); color: var(--bg); }
    .btn-primary:hover:not(:disabled) { background: var(--blue-dim); filter: brightness(1.1); }
    .btn-secondary { background: var(--bg2); color: var(--fg1); }
    .btn-secondary:hover:not(:disabled) { background: var(--bg3); }
    .btn-danger { background: var(--red); color: var(--bg); }
    .btn-danger:hover:not(:disabled) { background: var(--red-dim); filter: brightness(1.1); }
    .btn-ghost { background: transparent; color: var(--fg3); border: 1px solid var(--bg2); }
    .btn-ghost:hover:not(:disabled) { background: var(--bg1); color: var(--fg1); }
    .btn-sm { padding: 0.35rem 0.75rem; font-size: 0.85rem; }
    .btn-lg { padding: 0.75rem 1.5rem; font-size: 1.05rem; }
    .btn-loading { position: relative; color: transparent !important; pointer-events: none; }
    .btn-loading::after { content: ''; position: absolute; width: 1rem; height: 1rem; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ========== 状态徽章 ========== */
    .badge { display: inline-flex; align-items: center; padding: 0.2rem 0.6rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; line-height: 1; }
    .badge-green { background: var(--green-dim); color: var(--bg); }
    .badge-red { background: var(--red-dim); color: var(--bg); }
    .badge-yellow { background: var(--yellow-dim); color: var(--bg); }
    .badge-blue { background: var(--blue-dim); color: var(--bg); }
    .badge-gray { background: var(--bg3); color: var(--fg1); }

    /* ========== 表格组件 ========== */
    .table-wrap { overflow-x: auto; border: 1px solid var(--bg2); border-radius: var(--radius-lg); }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { padding: 0.75rem 1rem; text-align: left; border-bottom: 1px solid var(--bg2); }
    th { background: var(--bg1); color: var(--fg1); font-weight: 600; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; }
    tr { transition: background-color var(--transition-base); }
    tbody tr:hover { background: var(--bg1); cursor: pointer; }
    tbody tr:last-child td { border-bottom: none; }

    /* ========== 表单组件 ========== */
    .form-group { margin-bottom: 1rem; }
    .form-label { display: block; font-size: 0.875rem; font-weight: 500; color: var(--fg1); margin-bottom: 0.4rem; }
    .form-input, .form-select, .form-textarea { width: 100%; padding: 0.6rem 0.8rem; background: var(--bg_h); border: 1px solid var(--bg2); border-radius: var(--radius-md); color: var(--fg); font-size: 0.95rem; transition: border-color var(--transition-base), box-shadow var(--transition-base); }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgb(131 165 152 / 0.2); outline: none; }
    .form-input::placeholder { color: var(--fg4); }
    .form-textarea { min-height: 100px; resize: vertical; }
    .form-hint { font-size: 0.8rem; color: var(--fg3); margin-top: 0.25rem; }
    .form-error { font-size: 0.8rem; color: var(--red); margin-top: 0.25rem; }

    /* ========== 模态框 ========== */
    .modal-overlay { position: fixed; inset: 0; background: rgb(0 0 0 / 0.6); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; padding: 1rem; z-index: 200; opacity: 0; visibility: hidden; transition: opacity var(--transition-slow), visibility var(--transition-slow); }
    .modal-overlay:not([hidden]) { opacity: 1; visibility: visible; }
    .modal-content { background: var(--bg_s); border: 1px solid var(--bg2); border-radius: var(--radius-xl); max-width: 560px; width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-lg); transform: scale(0.95); transition: transform var(--transition-slow); }
    .modal-overlay:not([hidden]) .modal-content { transform: scale(1); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 1.25rem; border-bottom: 1px solid var(--bg2); }
    .modal-title { font-size: 1.125rem; font-weight: 600; color: var(--fg1); }
    .modal-close { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: none; background: transparent; color: var(--fg3); font-size: 1.5rem; cursor: pointer; border-radius: var(--radius-md); transition: all var(--transition-base); }
    .modal-close:hover { background: var(--bg2); color: var(--fg); }
    .modal-body { padding: 1.25rem; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 0.75rem; padding: 1rem 1.25rem; border-top: 1px solid var(--bg2); background: var(--bg1); border-radius: 0 0 var(--radius-xl) var(--radius-xl); }

    /* ========== Toast 通知 ========== */
    .toast-container { position: fixed; top: 1rem; left: 50%; transform: translateX(-50%); z-index: 300; display: flex; flex-direction: column; gap: 0.5rem; pointer-events: none; }
    .toast { display: flex; align-items: center; gap: 0.5rem; padding: 0.75rem 1rem; border-radius: var(--radius-md); font-size: 0.9rem; font-weight: 500; box-shadow: var(--shadow-lg); animation: toastIn 0.3s ease; pointer-events: auto; }
    .toast-success { background: var(--green-dim); color: var(--bg); }
    .toast-error { background: var(--red-dim); color: var(--bg); }
    .toast-warning { background: var(--yellow-dim); color: var(--bg); }
    .toast-info { background: var(--blue-dim); color: var(--bg); }
    @keyframes toastIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    .toast-out { animation: toastOut 0.3s ease forwards; }
    @keyframes toastOut { to { opacity: 0; transform: translateY(-10px); } }

    /* ========== 骨架屏 ========== */
    .skeleton { background: linear-gradient(90deg, var(--bg2) 25%, var(--bg3) 50%, var(--bg2) 75%); background-size: 200% 100%; animation: skeleton 1.5s ease-in-out infinite; border-radius: var(--radius-md); }
    @keyframes skeleton { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    /* ========== 代码块 ========== */
    pre { background: var(--bg_h); border: 1px solid var(--bg2); border-radius: var(--radius-md); padding: 1rem; overflow-x: auto; font-family: var(--font-family-monospace); font-size: 0.85rem; line-height: 1.6; color: var(--fg1); }
    code { font-family: var(--font-family-monospace); background: var(--bg1); padding: 0.15rem 0.4rem; border-radius: var(--radius-sm); font-size: 0.9em; color: var(--purple); }
    pre code { background: none; padding: 0; color: inherit; }

    /* ========== 分割线 ========== */
    .divider { height: 1px; background: var(--bg2); margin: 1rem 0; }

    /* ========== 空状态 ========== */
    .empty-state { text-align: center; padding: 3rem 1rem; color: var(--fg3); }
    .empty-state-icon { font-size: 3rem; margin-bottom: 1rem; opacity: 0.5; }
    .empty-state-title { font-size: 1.125rem; font-weight: 600; color: var(--fg2); margin-bottom: 0.5rem; }

    /* ========== 打印样式 ========== */
    @media print {
      .theme-controls, .toast-container, .modal-overlay { display: none !important; }
      body { background: #fff !important; color: #000 !important; }
      .card { border: 1px solid #ccc; break-inside: avoid; }
    }

    /* ========== 响应式 ========== */
    @media (max-width: 640px) {
      .container { padding: 1rem; }
      .grid-cols-2, .grid-cols-3, .grid-cols-4 { grid-template-columns: 1fr; }
      .theme-controls { top: auto; bottom: 1rem; right: 50%; transform: translateX(50%); }
      .modal-content { margin: 0.5rem; }
      .card { padding: 1rem; }
    }
    @media (max-width: 768px) {
      .grid-cols-4 { grid-template-columns: repeat(2, 1fr); }
    }
  </style>

<body>
  <!-- 主题切换控件 -->
  <div class="theme-controls" role="group" aria-label="主题切换">
    <button class="theme-btn" id="btn-dark" onclick="ThemeManager.set('theme-dark')" title="深色模式" aria-label="切换到深色模式">🌙</button>
    <button class="theme-btn" id="btn-light" onclick="ThemeManager.set('theme-light')" title="浅色模式" aria-label="切换到浅色模式">☀️</button>
    <div class="theme-divider"></div>
    <button class="theme-btn" id="btn-system" onclick="ThemeManager.followSystem()" title="跟随系统" aria-label="跟随系统主题">🖥️</button>
  </div>

  <!-- Toast 容器 -->
  <div class="toast-container" id="toast-container" aria-live="polite"></div>

  <!-- 模态框 -->
  <div class="modal-overlay" id="modal" role="dialog" aria-modal="true" hidden>
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-title">标题</h3>
        <button class="modal-close" onclick="Modal.close()" aria-label="关闭">×</button>
      </div>
      <div class="modal-body" id="modal-body">内容</div>
      <div class="modal-footer" id="modal-footer">
        <button class="btn btn-secondary" onclick="Modal.close()">取消</button>
        <button class="btn btn-primary" onclick="Modal.confirm()">确认</button>
      </div>
    </div>
  </div>

  <!-- 页面内容 -->
  <div class="container">
    <!-- ===== AI 生成内容插入区域 START ===== -->

    <header class="mb-8">
      <h1 class="text-3xl font-bold text-fg mb-2">🎨 统一模板</h1>
      <p class="text-fg3">基于 CSS 变量与 Gruvbox 配色方案的主题系统</p>
    </header>

    <div class="grid grid-cols-2 gap-4 mb-6">
      <div class="card card-hover">
        <div class="card-title">📊 统计卡片</div>
        <div class="card-body">
          <div class="text-2xl font-bold text-blue">1,234</div>
          <div class="text-sm text-fg3 mt-1">总用户数</div>
        </div>
      </div>
      <div class="card card-hover">
        <div class="card-title">📈 增长趋势</div>
        <div class="card-body">
          <div class="text-2xl font-bold text-green">+12.5%</div>
          <div class="text-sm text-fg3 mt-1">环比增长</div>
        </div>
      </div>
    </div>

    <div class="card mb-6">
      <div class="card-title">🧩 组件展示</div>
      <div class="card-body">
        <p class="mb-4">
          <span class="badge badge-green">正常</span>
          <span class="badge badge-yellow">警告</span>
          <span class="badge badge-red">错误</span>
          <span class="badge badge-blue">信息</span>
        </p>
        <p class="mb-4">
          <button class="btn btn-primary mr-2">主要按钮</button>
          <button class="btn btn-secondary mr-2">次要按钮</button>
          <button class="btn btn-danger mr-2">危险按钮</button>
          <button class="btn btn-ghost">幽灵按钮</button>
        </p>
        <p class="mb-4">
          <button class="btn btn-primary btn-loading mr-2">加载中</button>
          <button class="btn btn-primary btn-sm">小按钮</button>
        </p>
        <div class="form-group mb-4">

  <script>
    // ========== 主题按钮状态同步 ==========
    function updateThemeButtons() {
      const current = ThemeManager.getCurrent();
      const isManual = ThemeManager.isManual();
      document.getElementById('btn-dark').classList.toggle('active', current === 'theme-dark');
      document.getElementById('btn-light').classList.toggle('active', current === 'theme-light');
      document.getElementById('btn-system').classList.toggle('active', !isManual);
    }
    const observer = new MutationObserver(updateThemeButtons);
    observer.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
    updateThemeButtons();
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function() {
      if (!ThemeManager.isManual()) updateThemeButtons();
    });

    // ========== Toast 通知系统 ==========
    const Toast = {
      show: function(message, type) {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = 'toast toast-' + (type || 'info');
        toast.textContent = message;
        container.appendChild(toast);
        setTimeout(() => {
          toast.classList.add('toast-out');
          setTimeout(() => toast.remove(), 300);
        }, 3000);
      }
    };

    // ========== 模态框系统 ==========
    const Modal = {
      overlay: document.getElementById('modal'),
      title: document.getElementById('modal-title'),
      body: document.getElementById('modal-body'),
      footer: document.getElementById('modal-footer'),
      confirmCallback: null,

      open: function(title, content, options) {
        options = options || {};
        this.title.textContent = title || '提示';
        this.body.innerHTML = content || '';
        this.confirmCallback = options.onConfirm || null;

        if (options.hideFooter) {
          this.footer.style.display = 'none';
        } else {
          this.footer.style.display = 'flex';
          this.footer.innerHTML = options.footer || `
            <button class="btn btn-secondary" onclick="Modal.close()">取消</button>
            <button class="btn btn-primary" onclick="Modal.confirm()">确认</button>
          `;
        }

        this.overlay.hidden = false;
        document.body.style.overflow = 'hidden';

        // 点击遮罩关闭
        this.overlay.onclick = function(e) {
          if (e.target === this) Modal.close();
        };
        // ESC 关闭
        this._escHandler = function(e) {
          if (e.key === 'Escape') Modal.close();
        };
        document.addEventListener('keydown', this._escHandler);
      },

      close: function() {
        this.overlay.hidden = true;
        document.body.style.overflow = '';
        if (this._escHandler) document.removeEventListener('keydown', this._escHandler);
      },

      confirm: function() {
        if (this.confirmCallback) this.confirmCallback();
        this.close();
      }
    };
  </script>
