<!DOCTYPE html>
<html lang="zh-hans" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#282828" id="theme-color-meta">
    <title>字体测试</title>
    <meta name="description" content="字体家族测试页面，支持中英文混合排版预览">
    <script>
        (function () {
            const saved = localStorage.getItem('theme-preference');
            const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            let resolvedTheme;
            let preference;

            if (saved === 'dark' || saved === 'light' || saved === 'auto') {
                preference = saved;
            } else {
                preference = 'auto';
            }

            if (preference === 'auto') {
                resolvedTheme = systemDark ? 'dark' : 'light';
            } else {
                resolvedTheme = preference;
            }

            document.documentElement.setAttribute('data-theme', resolvedTheme);
            document.documentElement.setAttribute('data-theme-preference', preference);

            const meta = document.getElementById('theme-color-meta');
            if (meta) {
                meta.setAttribute('content', resolvedTheme === 'dark' ? '#282828' : '#fbf1c7');
            }
        })();
    </script>
    <style>
        :root {
            --transition-time: 0.2s;
            --transition-time-slow: 0.3s;
            --radius-sm: 2px;
            --radius-md: 4px;
            --breakpoint-sm: 576px;
            --breakpoint-md: 768px;
            --breakpoint-lg: 992px;
            --breakpoint-xl: 1200px;

            --color-primary: var(--green);
            --color-secondary: var(--yellow);
            --color-accent: var(--blue);
            --color-success: var(--green);
            --color-warning: var(--orange);
            --color-error: var(--red);
            --color-info: var(--blue);
            --text-primary: var(--fg1);
            --text-secondary: var(--fg3);
            --text-muted: var(--fg4);
            --text-inverse: var(--bg1);
            --bg-body: var(--bg);
            --bg-surface: var(--bg_s);
            --bg-overlay: #0000007F;
            --font-size-xs: 0.75rem;
            --font-size-sm: 0.875rem;
            --font-size-base: 1rem;
            --font-size-md: 1.125rem;
            --font-size-lg: 1.25rem;
            --font-size-xl: 1.5rem;
            font-size: 16px;
        }

        [data-theme="dark"] {
            color-scheme: dark;
            --bg_h: #1d2021;
            --bg: #282828;
            --bg_s: #32302f;
            --bg1: #3c3836;
            --bg2: #504945;
            --bg3: #665c54;
            --bg4: #7c6f64;
            --fg: #fbf1c7;
            --fg1: #ebdbb2;
            --fg2: #d5c4a1;
            --fg3: #bdae93;
            --fg4: #a89984;
            --red: #fb4934;
            --green: #b8bb26;
            --yellow: #fabd2f;
            --blue: #83a598;
            --purple: #d3869b;
            --aqua: #8ec07c;
            --gray: #928374;
            --orange: #fe8019;
            --red-dim: #cc2412;
            --green-dim: #98971a;
            --yellow-dim: #d79921;
            --blue-dim: #458588;
            --purple-dim: #b16286;
            --aqua-dim: #689d6a;
            --gray-dim: #a89984;
            --orange-dim: #d65d0e;
        }

        [data-theme="light"] {
            color-scheme: light;
            --bg_h: #f9f5d7;
            --bg: #fbf1c7;
            --bg_s: #f2e5bc;
            --bg1: #ebdbb2;
            --bg2: #d5c4a1;
            --bg3: #bdae93;
            --bg4: #a89984;
            --fg: #282828;
            --fg1: #3c3836;
            --fg2: #504945;
            --fg3: #665c54;
            --fg4: #7c6f64;
            --red: #9d0006;
            --green: #79740e;
            --yellow: #b57614;
            --blue: #076678;
            --purple: #8f3f71;
            --aqua: #427b58;
            --orange: #af3a03;
            --gray: #928374;
            --red-dim: #cc2412;
            --green-dim: #98971a;
            --yellow-dim: #d79921;
            --blue-dim: #458598;
            --purple-dim: #b16286;
            --aqua-dim: #689d6a;
            --orange-dim: #d65d0e;
            --gray-dim: #7c6f64;
        }

        a {
            color: var(--blue);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        a:hover {
            color: var(--blue-dim);
        }

        a:visited {
            color: var(--blue);
        }

        a:active {
            color: var(--blue);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        .header {
            background-color: var(--bg_h);
            border-bottom: 1px solid var(--bg2);
            padding: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-inner {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 1rem;
        }

        .header-title {
            font-size: var(--font-size-lg);
            font-weight: 700;
            color: var(--text-primary);
            margin-right: auto;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .category-tabs {
            display: flex;
            gap: 0.25rem;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 0.375rem 0.75rem;
            border: 1px solid var(--bg2);
            border-radius: var(--radius-sm);
            background-color: var(--bg-surface);
            color: var(--text-secondary);
            font-size: var(--font-size-sm);
            cursor: pointer;
            transition: background-color var(--transition-time), color var(--transition-time), border-color var(--transition-time);
            white-space: nowrap;
        }

        .tab-btn:hover {
            background-color: var(--bg1);
            color: var(--text-primary);
        }

        .tab-btn.active {
            background-color: var(--bg1);
            color: var(--text-primary);
            border-color: var(--bg3);
        }

        .size-control {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .size-control label {
            font-size: var(--font-size-sm);
            color: var(--text-secondary);
            white-space: nowrap;
        }

        .size-slider {
            width: 6rem;
            accent-color: var(--color-accent);
        }

        .size-value {
            font-size: var(--font-size-sm);
            color: var(--text-secondary);
            min-width: 2.5rem;
        }

        .theme-toggle {
            padding: 0.375rem 0.75rem;
            border: 1px solid var(--bg2);
            border-radius: var(--radius-sm);
            background-color: var(--bg-surface);
            color: var(--text-secondary);
            font-size: var(--font-size-sm);
            cursor: pointer;
            transition: background-color var(--transition-time), color var(--transition-time);
        }

        .theme-toggle:hover {
            background-color: var(--bg1);
            color: var(--text-primary);
        }

        .main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1rem;
        }

        .card-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
        }

        @media (min-width: 768px) {
            .card-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (min-width: 1200px) {
            .card-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .font-card {
            background-color: var(--bg-surface);
            border: 1px solid var(--bg2);
            border-radius: var(--radius-md);
            overflow: hidden;
            transition: border-color var(--transition-time);
        }

        .font-card:hover {
            border-color: var(--bg3);
        }

        .card-header {
            padding: 0.75rem 1rem;
            background-color: var(--bg_h);
            border-bottom: 1px solid var(--bg2);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
        }

        .font-name {
            font-size: var(--font-size-sm);
            font-weight: 600;
            color: var(--text-primary);
            word-break: break-all;
        }

        .font-category {
            font-size: var(--font-size-xs);
            color: var(--text-muted);
            background-color: var(--bg2);
            padding: 0.125rem 0.375rem;
            border-radius: var(--radius-sm);
            white-space: nowrap;
        }

        .card-body {
            padding: 1rem;
        }

        .preview-text {
            font-size: var(--font-size-base);
            line-height: 1.7;
            color: var(--text-primary);
            word-break: break-word;
        }

        .preview-text.bold {
            font-weight: 700;
            margin-top: 0.75rem;
            padding-top: 0.75rem;
            border-top: 1px solid var(--bg2);
        }

        .card-footer {
            padding: 0.5rem 1rem;
            background-color: var(--bg_h);
            border-top: 1px solid var(--bg2);
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .tag {
            font-size: var(--font-size-xs);
            color: var(--text-muted);
            background-color: var(--bg2);
            padding: 0.125rem 0.375rem;
            border-radius: var(--radius-sm);
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
            font-size: var(--font-size-md);
            grid-column: 1 / -1;
        }

        .footer {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1rem;
            text-align: center;
            font-size: var(--font-size-xs);
            color: var(--text-muted);
            border-top: 1px solid var(--bg2);
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <h1 class="header-title">Font Family 测试</h1>
            <div class="header-controls">
                <div class="category-tabs" id="categoryTabs"></div>
                <div class="size-control">
                    <label for="sizeSlider">字号</label>
                    <input type="range" id="sizeSlider" class="size-slider" min="12" max="24" value="16" step="1">
                    <span class="size-value" id="sizeValue">16px</span>
                </div>
                <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">切换主题</button>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="card-grid" id="cardGrid"></div>
    </main>

    <footer class="footer">
        <span>Font Family 测试页面</span>
    </footer>

    <script>
        // ========== 字体数据配置（统一接口） ==========
        const fontData = [
            // 系统字体
            { name: 'system-ui', category: '系统', tags: ['系统默认', '无衬线'] },
            { name: '-apple-system', category: '系统', tags: ['Apple', '无衬线'] },
            { name: 'BlinkMacSystemFont', category: '系统', tags: ['Chrome Mac', '无衬线'] },
            { name: 'Segoe UI', category: '系统', tags: ['Windows', '无衬线'] },
            { name: 'Roboto', category: '系统', tags: ['Android', '无衬线'] },
            { name: 'Helvetica Neue', category: '系统', tags: ['通用', '无衬线'] },
            { name: 'Arial', category: '系统', tags: ['通用', '无衬线'] },
            { name: 'Noto Sans', category: '系统', tags: ['Google', '无衬线'] },

            // 衬线字体
            { name: 'Georgia', category: '衬线', tags: ['经典', '衬线'] },
            { name: 'Times New Roman', category: '衬线', tags: ['经典', '衬线'] },
            { name: 'Palatino Linotype', category: '衬线', tags: ['优雅', '衬线'] },
            { name: 'Garamond', category: '衬线', tags: ['印刷', '衬线'] },
            { name: 'Cambria', category: '衬线', tags: ['Office', '衬线'] },
            { name: 'Noto Serif', category: '衬线', tags: ['Google', '衬线'] },

            // 等宽字体
            { name: 'Consolas', category: '等宽', tags: ['Windows', '代码'] },
            { name: 'Monaco', category: '等宽', tags: ['Mac', '代码'] },
            { name: 'Menlo', category: '等宽', tags: ['Mac', '代码'] },
            { name: 'JetBrains Mono', category: '等宽', tags: ['Mac', '代码'] },
            { name: 'Liberation Mono', category: '等宽', tags: ['Mac', '代码'] },
            { name: 'Courier New', category: '等宽', tags: ['通用', '代码'] },
            { name: 'Fira Code', category: '等宽', tags: ['编程', '连字'] },
            { name: 'JetBrains Mono', category: '等宽', tags: ['编程', 'IDE'] },
            { name: 'Source Code Pro', category: '等宽', tags: ['Adobe', '代码'] },

            // 中文字体
            { name: '"PingFang SC", "Microsoft YaHei", sans-serif', category: '中文', tags: ['苹方', '无衬线'] },
            { name: '"Microsoft YaHei", "PingFang SC", sans-serif', category: '中文', tags: ['微软雅黑', '无衬线'] },
            { name: '"Noto Sans SC", "PingFang SC", sans-serif', category: '中文', tags: ['思源黑体', '无衬线'] },
            { name: '"Noto Serif SC", "Songti SC", serif', category: '中文', tags: ['思源宋体', '衬线'] },
            { name: '"Songti SC", "SimSun", serif', category: '中文', tags: ['宋体', '衬线'] },
            { name: '"SimSun", "Songti SC", serif', category: '中文', tags: ['中易宋体', '衬线'] },
            { name: '"Kaiti SC", "STKaiti", serif', category: '中文', tags: ['楷体', '手写'] },
            { name: '"Heiti SC", "SimHei", sans-serif', category: '中文', tags: ['黑体', '无衬线'] },

            // 展示字体
            { name: 'Impact', category: '展示', tags: ['粗体', '标题'] },
            { name: 'Trebuchet MS', category: '展示', tags: ['现代', '标题'] },
            { name: 'Verdana', category: '展示', tags: ['清晰', '屏幕'] },
            { name: 'Tahoma', category: '展示', tags: ['紧凑', '屏幕'] },
            { name: 'Lato', category: '展示', tags: ['人文', '无衬线'] },
            { name: 'Open Sans', category: '展示', tags: ['友好', '无衬线'] },
        ];

        const previewText = 'The quick brown fox jumps over the lazy dog. 敏捷的棕色狐狸跳过了懒狗。\nABCDEFGHIJKLMNOPQRSTUVWXYZ\nabcdefghijklmnopqrstuvwxyz\n0123456789 ,.?!:/@";\'~()<>{*}&#$%^_+-=|\\`';

        // ========== 状态管理 ==========
        let currentCategory = '全部';
        let currentSize = 16;

        // ========== 获取所有分类 ==========
        function getCategories() {
            const cats = new Set(fontData.map(f => f.category));
            return ['全部', ...Array.from(cats)];
        }

        // ========== 渲染分类标签 ==========
        function renderTabs() {
            const container = document.getElementById('categoryTabs');
            const categories = getCategories();
            container.innerHTML = categories.map(cat =>
                `<button class="tab-btn ${cat === currentCategory ? 'active' : ''}" onclick="switchCategory('${cat}')">${cat}</button>`
            ).join('');
        }

        // ========== 切换分类 ==========
        function switchCategory(category) {
            currentCategory = category;
            renderTabs();
            renderCards();
        }

        // ========== 渲染卡片 ==========
        function renderCards() {
            const grid = document.getElementById('cardGrid');
            const filtered = currentCategory === '全部'
                ? fontData
                : fontData.filter(f => f.category === currentCategory);

            if (filtered.length === 0) {
                grid.innerHTML = '<div class="empty-state">该分类下暂无字体</div>';
                return;
            }

            grid.innerHTML = filtered.map(font => `
                <div class="font-card">
                    <div class="card-header">
                        <span class="font-name">${font.name}</span>
                        <span class="font-category">${font.category}</span>
                    </div>
                    <div class="card-body">
                        <div class="preview-text" style="font-family: ${font.name}; font-size: ${currentSize}px;">
                            ${previewText}
                        </div>
                        <div class="preview-text bold" style="font-family: ${font.name}; font-size: ${currentSize}px;">
                            ${previewText}
                        </div>
                    </div>
                    <div class="card-footer">
                        ${font.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                    </div>
                </div>
            `).join('');
        }

        // ========== 字号控制 ==========
        function setupSizeControl() {
            const slider = document.getElementById('sizeSlider');
            const value = document.getElementById('sizeValue');

            slider.addEventListener('input', (e) => {
                currentSize = e.target.value;
                value.textContent = currentSize + 'px';
                renderCards();
            });
        }

        // ========== 主题切换 ==========
        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme');
            const meta = document.getElementById('theme-color-meta');
            const next = current === 'dark' ? 'light' : 'dark';

            html.setAttribute('data-theme', next);
            html.setAttribute('data-theme-preference', next);
            localStorage.setItem('theme-preference', next);

            if (meta) {
                meta.setAttribute('content', next === 'dark' ? '#282828' : '#fbf1c7');
            }
        }

        // ========== 初始化 ==========
        function init() {
            renderTabs();
            renderCards();
            setupSizeControl();
        }

        init();
    </script>
</body>
</html>
