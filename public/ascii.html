<!DOCTYPE html>
<html lang="zh-hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASCII Table</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg_h: #1d2021;
  --bg:   #282828;
  --bg_s: #32302f;
  --bg1:  #3c3836;
  --bg2:  #504945;
  --bg3:  #665c54;
  --bg4:  #7c6f64;
  --fg:  #fbf1c7;
  --fg1: #ebdbb2;
  --fg2: #d5c4a1;
  --fg3: #bdae93;
  --fg4: #a89984;
  --red:    #fb4934;
  --green:  #b8bb26;
  --yellow: #fabd2f;
  --blue:   #83a598;
  --purple: #d3869b;
  --aqua:   #8ec07c;
  --gray:   #928374;
  --orange: #fe8019;
  --red-dim:    #cc2412;
  --green-dim:  #98971a;
  --yellow-dim: #d79921;
  --blue-dim:   #458588;
  --purple-dim: #b16286;
  --aqua-dim:   #689d6a;
  --gray-dim:   #a89984;
  --orange-dim: #d65d0e;
}

body {
  background: var(--bg_h);        
  color: var(--fg2);              
  font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
  min-height: 100vh;
  padding: 48px 32px;
}
header {
  text-align: center;
  margin-bottom: 40px;
}
header h1 {
  font-size: 22px;
  font-weight: 500;
  color: var(--fg1);              
  letter-spacing: 0.04em;
  margin-bottom: 6px;
}
header p {
  font-size: 13px;
  color: var(--bg4);              
  letter-spacing: 0.02em;
}
.table-wrap {
  max-width: 1100px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
}
.block {
  border: 1px solid var(--blue-dim);   
  overflow: hidden;
  background: var(--bg_h);             
}
.block-header {
  display: grid;
  grid-template-columns: 56px 56px 1fr;
  padding: 8px 14px;
  border-bottom: 1px solid var(--blue-dim);  
  background: var(--bg_h);                   
}
.block-header span {
  font-size: 11px;
  font-weight: 500;
  color: var(--blue);              
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.block-header span:last-child {
  text-align: center;
}
table {
  width: 100%;
  border-collapse: collapse;
}
tr {
  border-bottom: 1px solid var(--blue-dim);  
  transition: background 0.1s;
  height: 32px;
}
tr:last-child { border-bottom: none; }
tr:hover { background: var(--bg_s); }  
td {
  padding: 5px 14px;
  font-size: 13px;
  white-space: nowrap;
}
.td-dec {
  color: var(--fg);               
  width: 56px;
}
.td-hex {
  color: var(--aqua);             
  width: 56px;
  font-size: 12px;
}
.td-char {
  color: var(--fg1);              
  text-align: center;
}
.label {
  color: var(--fg3);              
  font-size: 11px;
}
.printable {
  color: var(--orange);           
  font-size: 14px;
  font-weight: 500;
}
.space-char {
  color: var(--fg4);              
  font-size: 11px;
}
footer {
  text-align: center;
  margin-top: 48px;
  font-size: 12px;
  color: var(--bg2);              
}
  @media (max-width: 800px) {
    .table-wrap { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 480px) {
    .table-wrap { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <h1>ASCII Table</h1>
</header>

<div class="table-wrap" id="root"></div>

<script>
const CTRL = {
  0:'NUL',1:'SOH',2:'STX',3:'ETX',4:'EOT',5:'ENQ',6:'ACK',7:'BEL',
  8:'BS',9:'HT',10:'LF',11:'VT',12:'FF',13:'CR',14:'SO',15:'SI',
  16:'DLE',17:'DC1',18:'DC2',19:'DC3',20:'DC4',21:'NAK',22:'SYN',23:'ETB',
  24:'CAN',25:'EM',26:'SUB',27:'ESC',28:'FS',29:'GS',30:'RS',31:'US',
  127:'DEL'
};

const CHUNK = 32;
const root = document.getElementById('root');

for (let b = 0; b < 4; b++) {
  const start = b * CHUNK;
  const end = start + CHUNK;

  const block = document.createElement('div');
  block.className = 'block';

  const hdr = document.createElement('div');
  hdr.className = 'block-header';
  hdr.innerHTML = '<span>Dec</span><span>Hex</span><span>Char</span>';
  block.appendChild(hdr);

  const tbl = document.createElement('table');
  const tbody = document.createElement('tbody');

  for (let i = start; i < end; i++) {
    const hex = '0x' + i.toString(16).toUpperCase().padStart(2, '0');
    let charCell;

    if (i in CTRL) {
      charCell = `<span class="label">${CTRL[i]}</span>`;
    } else if (i === 32) {
      charCell = `<span class="space-char">SP</span>`;
    } else {
      const ch = String.fromCharCode(i);
      const safe = ch === '<' ? '&lt;' : ch === '>' ? '&gt;' : ch === '&' ? '&amp;' : ch;
      charCell = `<span class="printable">${safe}</span>`;
    }

    const tr = document.createElement('tr');
    tr.innerHTML = `<td class="td-dec">${i}</td><td class="td-hex">${hex}</td><td class="td-char">${charCell}</td>`;
    tbody.appendChild(tr);
  }

  tbl.appendChild(tbody);
  block.appendChild(tbl);
  root.appendChild(block);
}
</script>
</body>
</html>
