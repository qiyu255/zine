<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASCII Table</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0f1117;
    color: #c9d1d9;
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
    min-height: 100vh;
    padding: 48px 32px;
  }

  header {
    text-align: center;
    margin-bottom: 40px;
  }

  header h1 {
    font-size: 22px;
    font-weight: 500;
    color: #e6edf3;
    letter-spacing: 0.04em;
    margin-bottom: 6px;
  }

  header p {
    font-size: 13px;
    color: #6e7681;
    letter-spacing: 0.02em;
  }

  .table-wrap {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
  }

  .block {
    border: 1px solid #455f84;
    overflow: hidden;
    background: #161b22;
  }

  .block-header {
    display: grid;
    grid-template-columns: 56px 56px 1fr;
    padding: 8px 14px;
    border-bottom: 1px solid #455f84;
    background: #0d1117;
  }

  .block-header span {
    font-size: 11px;
    font-weight: 500;
    color: #85b9fb;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .block-header span:last-child {
    text-align: center;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  tr {
    border-bottom: 1px solid #455f84;
    transition: background 0.1s;
    height: 32px;
  }

  tr:last-child { border-bottom: none; }

  tr:hover { background: #1c2128; }

  td {
    padding: 5px 14px;
    font-size: 13px;
    /* line-height: 1.6; */
    white-space: nowrap;
  }

  .td-dec {
    color: #ffffff;
    width: 56px;
  }

  .td-hex {
    color: #7ee787;
    width: 56px;
    font-size: 12px;
  }

  .td-char {
    color: #e6edf3;
    text-align: center;
  }

  .label {
    color: #b2b9c2;
    font-size: 11px;
  }

  .printable {
    color: #ffa657;
    font-size: 14px;
    font-weight: 500;
  }

  .space-char {
    color: #a5aab0;
    font-size: 11px;
  }

  footer {
    text-align: center;
    margin-top: 48px;
    font-size: 12px;
    color: #484f58;
  }

  @media (max-width: 800px) {
    .table-wrap { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 480px) {
    .table-wrap { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <h1>ASCII Table</h1>
</header>

<div class="table-wrap" id="root"></div>

<script>
const CTRL = {
  0:'NUL',1:'SOH',2:'STX',3:'ETX',4:'EOT',5:'ENQ',6:'ACK',7:'BEL',
  8:'BS',9:'HT',10:'LF',11:'VT',12:'FF',13:'CR',14:'SO',15:'SI',
  16:'DLE',17:'DC1',18:'DC2',19:'DC3',20:'DC4',21:'NAK',22:'SYN',23:'ETB',
  24:'CAN',25:'EM',26:'SUB',27:'ESC',28:'FS',29:'GS',30:'RS',31:'US',
  127:'DEL'
};

const CHUNK = 32;
const root = document.getElementById('root');

for (let b = 0; b < 4; b++) {
  const start = b * CHUNK;
  const end = start + CHUNK;

  const block = document.createElement('div');
  block.className = 'block';

  const hdr = document.createElement('div');
  hdr.className = 'block-header';
  hdr.innerHTML = '<span>Dec</span><span>Hex</span><span>Char</span>';
  block.appendChild(hdr);

  const tbl = document.createElement('table');
  const tbody = document.createElement('tbody');

  for (let i = start; i < end; i++) {
    const hex = '0x' + i.toString(16).toUpperCase().padStart(2, '0');
    let charCell;

    if (i in CTRL) {
      charCell = `<span class="label">${CTRL[i]}</span>`;
    } else if (i === 32) {
      charCell = `<span class="space-char">SP</span>`;
    } else {
      const ch = String.fromCharCode(i);
      const safe = ch === '<' ? '&lt;' : ch === '>' ? '&gt;' : ch === '&' ? '&amp;' : ch;
      charCell = `<span class="printable">${safe}</span>`;
    }

    const tr = document.createElement('tr');
    tr.innerHTML = `<td class="td-dec">${i}</td><td class="td-hex">${hex}</td><td class="td-char">${charCell}</td>`;
    tbody.appendChild(tr);
  }

  tbl.appendChild(tbody);
  block.appendChild(tbl);
  root.appendChild(block);
}
</script>
</body>
</html>
